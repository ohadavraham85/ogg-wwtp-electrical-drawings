<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="basinGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#bfe0ea"/>
      <path d="M26 0H0V26" fill="none" stroke="#8fc4d6" stroke-width="1"/>
    </pattern>
    <radialGradient id="terrainGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#efe9da"/>
      <stop offset="100%" stop-color="#ddd4bd"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" fill="url(#terrainGrad)"/>

  <!-- soft contour lines for terrain texture -->
  <g fill="none" stroke="#cabf9f" stroke-width="2" opacity="0.55">
    <path d="M40 120 Q 400 40, 780 130 T 1560 90"/>
    <path d="M20 260 Q 420 190, 820 270 T 1580 230"/>
    <path d="M10 900 Q 380 980, 760 910 T 1560 960"/>
    <path d="M60 1020 Q 440 1080, 840 1010 T 1580 1060"/>
    <path d="M900 40 Q 980 300, 900 560"/>
    <path d="M1520 200 Q 1460 500, 1540 800"/>
  </g>

  <!-- access road, bottom-left -->
  <g>
    <path d="M20 1010 L 640 800" stroke="#9aa0a6" stroke-width="26" stroke-linecap="round"/>
    <path d="M20 1010 L 640 800" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="14 12"/>
  </g>

  <!-- developed plant area outline -->
  <path d="M300 190 L 1460 210 L 1470 1000 L 560 1030 L 330 880 Z" fill="#f7f5ee" stroke="#b7ad8f" stroke-width="3" opacity="0.9"/>

  <!-- landscaped garden / pond area, top-left -->
  <g>
    <path d="M340 230 Q 560 190, 760 260 Q 900 310, 840 420 Q 760 500, 600 470 Q 420 440, 360 350 Z" fill="#dcefd8" stroke="#8fbf86" stroke-width="2"/>
    <ellipse cx="620" cy="330" rx="90" ry="55" fill="#a9d7e8" stroke="#6fb0c9" stroke-width="2"/>
    <path d="M420 260 Q 520 240, 600 300 Q 680 350, 780 320" fill="none" stroke="#c9a24a" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <g fill="#5c9c53">
      <circle cx="380" cy="250" r="10"/><circle cx="410" cy="290" r="9"/><circle cx="700" cy="240" r="10"/>
      <circle cx="760" cy="290" r="9"/><circle cx="470" cy="440" r="9"/><circle cx="600" cy="460" r="10"/>
      <circle cx="700" cy="420" r="9"/><circle cx="360" cy="330" r="8"/>
    </g>
  </g>

  <!-- green corridor / walkway connecting garden to the plant core -->
  <path d="M640 430 Q 660 620, 640 800" fill="none" stroke="#bcdcae" stroke-width="46" opacity="0.75"/>
  <path d="M640 430 Q 660 620, 640 800" fill="none" stroke="#8fbf86" stroke-width="4" stroke-dasharray="2 10" opacity="0.9"/>

  <!-- aeration tanks, 2x2 grid top-right -->
  <g stroke="#4a90c4" stroke-width="3" fill="#eef5fa">
    <rect x="980" y="230" width="210" height="150" rx="6"/>
    <rect x="1220" y="230" width="210" height="150" rx="6"/>
    <rect x="980" y="410" width="210" height="150" rx="6"/>
    <rect x="1220" y="410" width="210" height="150" rx="6"/>
  </g>
  <g stroke="#9cc3de" stroke-width="1.5" opacity="0.8">
    <path d="M980 305 H1190 M1220 305 H1430 M980 485 H1190 M1220 485 H1430"/>
    <path d="M1085 230 V380 M1325 230 V380 M1085 410 V560 M1325 410 V560"/>
  </g>

  <!-- clarifiers, row of circles -->
  <g>
    <circle cx="1005" cy="640" r="34" fill="#dff2e4" stroke="#4caf7d" stroke-width="3"/>
    <circle cx="1080" cy="640" r="34" fill="#dff2e4" stroke="#4caf7d" stroke-width="3"/>
    <circle cx="1155" cy="640" r="34" fill="#dff2e4" stroke="#4caf7d" stroke-width="3"/>
    <circle cx="1230" cy="640" r="38" fill="#cdeed6" stroke="#2f7a52" stroke-width="3"/>
    <circle cx="1315" cy="640" r="38" fill="#cdeed6" stroke="#2f7a52" stroke-width="3"/>
    <circle cx="1400" cy="640" r="34" fill="#dff2e4" stroke="#4caf7d" stroke-width="3"/>
    <g fill="#2f7a52" opacity="0.6">
      <circle cx="1005" cy="640" r="4"/><circle cx="1080" cy="640" r="4"/><circle cx="1155" cy="640" r="4"/>
      <circle cx="1230" cy="640" r="4"/><circle cx="1315" cy="640" r="4"/><circle cx="1400" cy="640" r="4"/>
    </g>
  </g>

  <!-- large filtration / storage basin, bottom-left, with grid pattern -->
  <g>
    <rect x="600" y="700" width="380" height="220" rx="4" fill="url(#basinGrid)" stroke="#4a90c4" stroke-width="3"/>
    <rect x="600" y="700" width="380" height="220" rx="4" fill="none" stroke="#2c5d8a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- small utility building near the basin -->
  <rect x="610" y="630" width="130" height="60" rx="4" fill="#f2ede0" stroke="#8a7f5f" stroke-width="2.5"/>
  <path d="M610 630 L675 605 L740 630" fill="none" stroke="#8a7f5f" stroke-width="2.5"/>

  <!-- misc small process units, right-middle -->
  <g fill="#f6d97a" stroke="#b5720a" stroke-width="2">
    <rect x="1350" y="700" width="50" height="70" rx="3"/>
    <rect x="1410" y="700" width="50" height="70" rx="3"/>
  </g>

  <!-- teal treatment pond, bottom-right -->
  <ellipse cx="1300" cy="960" rx="150" ry="95" fill="#bfe6e0" stroke="#2f9e8f" stroke-width="4"/>
  <ellipse cx="1300" cy="960" rx="105" ry="60" fill="none" stroke="#2f9e8f" stroke-width="2.5" opacity="0.7"/>

  <!-- scattered landscaping trees along the plant edges -->
  <g fill="#5c9c53" opacity="0.85">
    <circle cx="960" cy="230" r="8"/><circle cx="1460" cy="240" r="8"/><circle cx="1470" cy="600" r="8"/>
    <circle cx="1000" cy="900" r="8"/><circle cx="1460" cy="880" r="8"/><circle cx="700" cy="920" r="8"/>
    <circle cx="1120" cy="960" r="8"/><circle cx="1420" cy="1040" r="8"/>
  </g>

  <!-- title block -->
  <g>
    <rect x="24" y="24" width="430" height="70" rx="8" fill="#ffffff" opacity="0.85" stroke="#b7ad8f"/>
    <text x="44" y="52" font-size="22" font-weight="700" fill="#3a4855">OGG WWTP — תרשים סכמטי</text>
    <text x="44" y="76" font-size="14" fill="#6b7885">איור עזר לסימון מיקומי לוחות (לא לשימוש הנדסי)</text>
  </g>
</svg>
