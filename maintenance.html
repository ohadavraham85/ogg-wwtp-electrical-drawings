<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוחות אחזקת חשמל | מט"ש אוג</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3864;
  --navy-2:#2c4a86;
  --rule:#365198;
  --steel:#4c5f80;
  --bg:#eef1f6;
  --card:#ffffff;
  --line:#c9d3e2;
  --ink:#1c2431;
  --ink-dim:#5b6577;
  --ok:#1e7a4c;
  --ok-bg:#e6f5ec;
  --bad:#b83232;
  --bad-bg:#fbe8e6;
  --shadow: 0 1px 2px rgba(31,56,100,.06), 0 4px 16px rgba(31,56,100,.07);
  --radius: 8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Rubik','Heebo',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--navy);color:#fff;}

/* ---------- Letterhead top bar (mirrors the plant's official form header) ---------- */
.letterhead{
  background:#fff;
  position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow);
}
.lh-inner{
  max-width:1080px;margin:0 auto;
  display:flex;align-items:center;gap:16px;justify-content:space-between;
  padding:10px 20px;
}
.lh-logo{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.lh-logo img{height:52px;width:auto;display:block;}
.lh-title{text-align:center;flex:1;min-width:0;}
.lh-title h1{margin:0;font-size:16px;font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:3px;}
.lh-title p{margin:3px 0 0;font-size:12px;color:var(--ink-dim);}
.lh-photo{flex:0 0 auto;}
.lh-photo img{height:52px;width:auto;border-radius:4px;display:block;}
.lh-rule{height:4px;background:linear-gradient(var(--rule),var(--rule)) top/100% 1.5px no-repeat, linear-gradient(var(--rule),var(--rule)) bottom/100% 1.5px no-repeat;}
.lh-nav{max-width:1080px;margin:0 auto;padding:6px 20px;display:flex;justify-content:flex-start;gap:8px;flex-wrap:wrap;}
.pill-btn-feedback{color:var(--bad);border-color:#f0d4d4;}
.pill-btn-feedback:hover{border-color:var(--bad);background:#fef4f4;}
.pill-btn{
  background:#fff;border:1.5px solid var(--line);
  color:var(--navy);padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.15s;
  text-decoration:none;
}
.pill-btn:hover{border-color:var(--navy);}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px;}
.hero{margin-bottom:26px;}
.eyebrow{
  font-size:12px;letter-spacing:1px;
  color:var(--steel);text-transform:uppercase;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--steel);display:inline-block;}
.hero h2{font-size:24px;margin:8px 0 6px;font-weight:700;color:var(--navy);}
.hero p{color:var(--ink-dim);font-size:14px;max-width:660px;line-height:1.65;margin:0;}

/* ---------- Section group ---------- */
.group{margin-bottom:32px;}
.group-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
  border-bottom:1.5px solid var(--navy);padding-bottom:7px;
}
.group-head .tag{
  font-size:11px;font-weight:700;
  background:var(--navy);color:#fff;padding:3px 9px;border-radius:4px;letter-spacing:.3px;
}
.group-head h3{font-size:16px;margin:0;font-weight:700;color:var(--navy);}
.group-head .count{font-size:12.5px;color:var(--ink-dim);margin-inline-start:auto;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

.report-card{border:0;background:transparent;padding:0;text-align:right;}
.report-card .rc-inner{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  border-inline-start:3px solid var(--rule);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;height:100%;
  transition:.12s;
}
.report-card:hover .rc-inner{border-inline-start-color:var(--navy);box-shadow:0 6px 20px rgba(31,56,100,.14);transform:translateY(-1px);}
.report-card .rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.report-card .rc-icon{color:var(--navy);opacity:.85;flex:0 0 auto;display:flex;}
.report-card .rc-code{
  font-size:11px;color:var(--ink-dim);
  display:flex;justify-content:flex-end;align-items:center;gap:6px;
}
.report-card .rc-code .draft-flag{
  background:var(--navy);color:#fff;font-weight:700;padding:2px 8px;border-radius:999px;font-size:10px;
}
.report-card h4{margin:0;font-size:15px;line-height:1.4;font-weight:700;color:var(--navy);min-height:42px;}
.report-card .rc-fill{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:600;color:var(--steel);
}
.report-card .rc-fill span.arrow{font-size:16px;transition:.15s;}
.report-card:hover .rc-fill{color:var(--navy);}
.report-card:hover .rc-fill span.arrow{transform:translateX(-3px);}

/* ---------- Folder cards (top-level navigation) ---------- */
.folder-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.folder-card{cursor:pointer;}
.folder-card .fc-inner{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  border-inline-start:3px solid var(--rule);
  padding:24px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;
  gap:8px;text-align:center;transition:.12s;height:100%;
}
.folder-card:hover .fc-inner{border-inline-start-color:var(--navy);box-shadow:0 8px 22px rgba(31,56,100,.16);transform:translateY(-2px);}
.folder-card .fc-icon{color:var(--navy);margin-bottom:6px;display:flex;align-items:center;justify-content:center;}
.folder-card .fc-icon svg{display:block;}
.folder-card .fc-inner h4{margin:0;font-size:16px;font-weight:700;color:var(--navy);}
.folder-card .fc-count{font-size:12.5px;color:var(--ink-dim);}
.folder-card .fc-arrow{font-size:16px;color:var(--steel);margin-top:6px;transition:.15s;}
.folder-card:hover .fc-arrow{transform:translateX(-3px);color:var(--navy);}

/* ---------- Drafts strip ---------- */
.drafts-box{
  background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 18px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px;
  box-shadow:var(--shadow);
}
.drafts-box.empty{background:var(--card);color:var(--ink-dim);border:1px dashed var(--line);font-size:13.5px;}
.drafts-box h4{margin:0;font-size:12.5px;color:#cfdaf0;letter-spacing:.4px;text-transform:uppercase;font-weight:700;}
.draft-chip{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  padding:7px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center;cursor:pointer;
}
.draft-chip:hover{border-color:#fff;}
.draft-chip small{color:#cfdaf0;font-size:11px;}
.draft-chip .del{color:#e8b9b9;font-size:15px;padding:0 2px;}
.draft-chip .del:hover{color:#ffd3d3;}

/* ---------- Report view ---------- */
.report-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;
}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--navy);box-shadow:var(--shadow);
  margin-bottom:14px;
}
.back-btn:hover{border-color:var(--navy);}
.report-title-block .tag{
  font-size:11px;font-weight:700;background:var(--navy);color:#fff;
  padding:3px 9px;border-radius:4px;letter-spacing:.3px;display:inline-block;margin-bottom:8px;
}
.report-title-block h2{margin:0 0 4px;font-size:21px;font-weight:700;color:var(--navy);}
.report-title-block p{margin:0;color:var(--ink-dim);font-size:13.5px;}

.print-area{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:0 0 28px;box-shadow:var(--shadow);
}
.print-area .doc-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 22px 12px;
}
.print-area .doc-head .dh-logo img{height:48px;width:auto;display:block;}
.print-area .doc-head .dh-photo img{height:48px;width:auto;border-radius:4px;display:block;}
.print-area .doc-head .dh-center{flex:1;text-align:center;min-width:0;}
.print-area .doc-head .dh-center .dh-inst{font-size:14.5px;font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:3px;}
.print-area .doc-head .dh-center .dh-sub{font-size:11.5px;color:var(--ink-dim);margin-top:3px;}
.print-area .doc-rule{height:4px;background:linear-gradient(var(--rule),var(--rule)) top/100% 1.5px no-repeat, linear-gradient(var(--rule),var(--rule)) bottom/100% 1.5px no-repeat;margin-bottom:18px;}
.print-area .doc-body{padding:0 24px;}
.print-area .doc-tagline{text-align:left;font-size:12px;text-decoration:underline;color:var(--ink);margin-bottom:14px;}
.print-area .doc-title{text-align:center;font-size:18px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:4px;margin-bottom:22px;}

.section{margin-bottom:24px;}
.section-title{
  font-size:14.5px;font-weight:700;color:var(--navy);margin:0 0 10px;
  text-decoration:underline;text-underline-offset:3px;
  display:flex;align-items:center;gap:8px;
}

.grid-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-dim);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:14px;color:var(--ink);
  background:#fbfcfe;transition:.12s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-2);background:#fff;box-shadow:0 0 0 3px rgba(44,74,134,.13);}
.field textarea{resize:vertical;min-height:64px;}
.photos-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.photo-thumb{position:relative;width:92px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background-size:cover;background-position:center;background-repeat:no-repeat;background-color:#eef1f6;}
.photo-thumb .photo-remove{
  position:absolute;top:3px;left:3px;background:rgba(20,26,36,.72);color:#fff;border:none;
  width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.photo-thumb .photo-remove:hover{background:var(--bad);}
.photo-add-btn{
  width:92px;height:92px;border-radius:8px;border:1.5px dashed var(--steel);background:#fbfcfe;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;color:var(--steel);cursor:pointer;text-align:center;padding:4px;
}
.photo-add-btn span:first-child{font-size:20px;}
.photo-add-btn:hover{border-color:var(--navy);color:var(--navy);}
.req-star{color:var(--bad);margin-inline-start:2px;}
.opt-note{color:var(--ink-dim);font-weight:400;font-size:11.5px;margin-inline-start:4px;}
.field-invalid{border-color:var(--bad) !important;box-shadow:0 0 0 2px rgba(184,50,50,.15) !important;background:#fffaf9 !important;}
.sig-canvas.field-invalid{border-color:var(--bad) !important;border-width:2px;box-shadow:0 0 0 2px rgba(184,50,50,.15);}
.required-note{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);
  background:#fbfaf7;border:1px solid var(--line);border-radius:7px;padding:8px 12px;margin-bottom:16px;
}

table.rep-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.rep-table th{
  background:#fff;color:var(--navy);font-weight:700;font-size:12.5px;
  padding:9px 10px;text-align:right;border-bottom:2px solid var(--navy);border-inline:1px solid var(--line);
}
table.rep-table td{
  border:1px solid var(--line);padding:6px 8px;vertical-align:middle;background:#fff;
}
table.rep-table tr:nth-child(even) td{background:#f7f9fc;}
table.rep-table td.lbl{font-weight:600;color:var(--ink);font-size:13.5px;min-width:150px;}
.row-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;padding:0 5px;margin-inline-end:8px;
  background:var(--navy);color:#fff;border-radius:5px;
  font-size:11px;font-weight:700;font-family:inherit;vertical-align:middle;
}
table.rep-table td.hint{color:var(--ink-dim);font-size:11.5px;}
table.rep-table select, table.rep-table input{
  border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:13px;width:100%;background:#fbfcfe;
}
table.rep-table select:focus, table.rep-table input:focus{outline:none;border-color:var(--navy-2);background:#fff;}

select.status-select{font-weight:700;}

/* Fixed unit-suffix input group (V / A / % / Ω...) — the unit stays visible
   even after the person types a value, instead of a placeholder that vanishes. */
.input-unit{display:flex;align-items:stretch;width:100%;}
.input-unit input{flex:1;min-width:0;border-radius:6px 0 0 6px;border-left:none;}
.input-unit input:focus{position:relative;z-index:1;border-radius:6px;}
.input-unit .unit-suffix{
  display:flex;align-items:center;justify-content:center;padding:0 8px;
  background:#eef1f6;border:1px solid var(--line);border-radius:0 6px 6px 0;
  font-size:11.5px;color:var(--steel);font-weight:700;white-space:nowrap;flex:0 0 auto;
}

/* Hour + minute picker — label sits above each box (not squeezed beside it)
   so the tap target stays wide even inside a narrow table cell on a phone. */
.hourmin-group{display:flex;gap:6px;width:100%;}
.hm-field{display:flex;flex-direction:column;align-items:stretch;gap:3px;flex:1;min-width:0;}
.hm-field input{width:100%;text-align:center;padding:8px 2px;font-size:14px;}
.hm-field label{font-size:10px;color:var(--ink-dim);text-align:center;font-weight:600;}

/* No spinner arrows on number inputs — they eat width and aren't needed
   since every numeric field already opens the phone's number keypad. */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type="number"]{-moz-appearance:textfield;}
select.status-select.val-ok, input.status-select.val-ok{color:var(--ok);}
select.status-select.val-bad{color:var(--bad);}
td.status-cell.val-ok{background:var(--ok-bg) !important;}
td.status-cell.val-bad{background:var(--bad-bg) !important;}

.table-scroll{overflow-x:auto;border-radius:8px;border:1px solid var(--line);}
.table-scroll table{border:none;border-radius:0;}
.table-scroll table td, .table-scroll table th{border-inline:1px solid var(--line);}

.row-actions-bar{display:flex;justify-content:flex-end;margin-top:8px;}
.add-row-btn{
  background:#fff;border:1.5px dashed var(--steel);color:var(--steel);font-weight:600;font-size:13px;
  padding:7px 14px;border-radius:8px;display:flex;align-items:center;gap:6px;
}
.add-row-btn:hover{border-color:var(--navy);color:var(--navy);}
.rm-row-btn{background:none;border:none;color:var(--bad);font-size:16px;padding:2px 6px;}
.rm-row-btn:hover{opacity:.7;}

.signoff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;align-items:end;}
.sig-wrap{display:flex;flex-direction:column;gap:5px;}
.sig-wrap label{font-size:12.5px;font-weight:600;color:var(--ink-dim);}
.sig-canvas{
  border:1px solid var(--line);border-radius:6px;background:#fbfcfe;touch-action:none;width:100%;height:80px;
  display:block;
}
.sig-clear{align-self:flex-start;font-size:11.5px;color:var(--ink-dim);background:none;border:none;padding:2px 0;text-decoration:underline;}
.sig-clear:hover{color:var(--bad);}

.actions-bar{
  position:sticky;bottom:16px;margin-top:22px;
  background:var(--navy);border-radius:12px;padding:14px 18px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  box-shadow:0 10px 30px rgba(31,56,100,.35);
}
.actions-bar .status-note{color:#cfdaf0;font-size:12.5px;}
.actions-bar .btns{display:flex;gap:10px;flex-wrap:wrap;}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:7px;transition:.12s;
}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.28);}
.btn-ghost:hover{border-color:#fff;}
.btn-primary{background:#fff;color:var(--navy);}
.btn-primary:hover{background:#dce6f5;}
.btn-primary:disabled{opacity:.6;cursor:default;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(31,56,100,.4);opacity:0;pointer-events:none;transition:.25s;z-index:200;
  display:flex;align-items:center;gap:8px;border-left:3px solid var(--rule);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.footer-note{max-width:1080px;margin:10px auto 0;padding:0 20px 30px;color:var(--ink-dim);font-size:12px;text-align:center;}

@media (max-width:640px){
  .lh-inner{padding:8px 12px;gap:8px;}
  .lh-logo img{height:38px;}
  .lh-photo img{height:38px;}
  .lh-title h1{font-size:12.5px;}
  .lh-title p{font-size:10px;}
  .lh-nav{padding:5px 12px;}
  .pill-btn{padding:6px 10px;font-size:11.5px;}
  .wrap{padding:16px 12px 110px;}
  .hero h2{font-size:19px;}
  .hero p{font-size:13px;}
  .card-grid{grid-template-columns:1fr;}
  .print-area .doc-head{padding:10px 12px 8px;}
  .print-area .doc-head .dh-logo img,.print-area .doc-head .dh-photo img{height:34px;}
  .print-area .doc-head .dh-center .dh-inst{font-size:12px;}
  .print-area .doc-head .dh-center .dh-sub{font-size:10px;}
  .print-area .doc-body{padding:0 12px;}
  .print-area .doc-title{font-size:15px;margin-bottom:16px;}
  .grid-fields{grid-template-columns:1fr 1fr;gap:8px;}
  .signoff-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .section-title{font-size:13px;}
  table.rep-table{font-size:12px;min-width:640px;}
  table.rep-table th, table.rep-table td{padding:7px 6px;}
  table.rep-table td.lbl{min-width:130px;font-size:12px;white-space:normal;}
  table.rep-table input[type="date"]{font-size:11px;padding:6px 3px;}
  .table-scroll{-webkit-overflow-scrolling:touch;}
  .field label{font-size:11.5px;}
  .field input,.field select,.field textarea{padding:8px;font-size:13px;}
  /* Hour/minute + unit-suffix fields need real width to stay tappable —
     give their table columns more room instead of letting them get crushed. */
  table.rep-table td:has(.hourmin-group){min-width:150px;}
  table.rep-table td:has(.input-unit){min-width:130px;}
  .hourmin-group{gap:8px;}
  .hm-field input{padding:10px 2px;font-size:15px;min-height:40px;}
  .hm-field label{font-size:10.5px;}
  .input-unit input{padding:9px 8px;font-size:14px;min-height:38px;}
  .input-unit .unit-suffix{font-size:12px;padding:0 9px;}
  .actions-bar{flex-direction:column;align-items:stretch;position:fixed;left:0;right:0;bottom:0;border-radius:14px 14px 0 0;margin:0;z-index:60;}
  .actions-bar .status-note{order:2;text-align:center;font-size:11px;}
  .actions-bar .btns{justify-content:stretch;order:1;}
  .btn{flex:1;justify-content:center;padding:12px 10px;font-size:12.5px;}
  .back-btn{font-size:12.5px;padding:7px 12px;}
  .report-title-block h2{font-size:18px;}
  .report-title-block p{font-size:12.5px;}
}
@media (max-width:400px){
  .grid-fields{grid-template-columns:1fr;}
  .signoff-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="letterhead" id="letterhead"></div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function grid(fields){ return {type:'grid', fields}; }
function f(key,label,type,opts={}){ return {key,label,type,...opts}; }

function checklist(title, rows, opts={}){
  return {type:'checklist', title, rows, extraCols: opts.extraCols||null};
}
// row: {label, kind:'status'|'exec'|'check', extra:{label,placeholder}, hint, dateCols:true}
function row(label, opts={}){ return {label, kind: opts.kind||'status', extra: opts.extra||null, hint: opts.hint||'', dateCols: !!opts.dateCols, numeric: !!opts.numeric, unit: opts.unit||''}; }

function logtable(title, columns){ return {type:'logtable', title, columns, minRows:6}; }
function notes(label){ return {type:'notes', label: label || 'הערות כלליות'}; }
function signoff(variant){ return {type:'signoff', variant: variant||'basic'}; }

/* ---------------------------------------------------------------------- */
/* Auto-fill helpers for date/time defaults                               */
/* ---------------------------------------------------------------------- */
function autoValue(auto){
  const d = new Date();
  if(auto==='today'){
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${mm}-${dd}`; // matches <input type="date">
  }
  if(auto==='time'){
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${hh}:${mi}`;
  }
  if(auto==='month') return String(d.getMonth()+1);
  if(auto==='monthname') return MONTH_NAMES[d.getMonth()];
  if(auto==='year') return String(d.getFullYear());
  return '';
}

    f('freq','תדירות','text',{default:defaults.freq}),

  ]);
}

  return d.toLocaleDateString('he-IL');
}

let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

function countInFolder(node){
  if(node.children) return node.children.reduce((sum,c)=>sum+REPORTS.filter(r=>r.group===c.key).length, 0);
  return REPORTS.filter(r=>r.group===node.key).length;
}

function folderCardHtml(node, dataAttrs){
  const count = countInFolder(node);
  const iconSvg = FOLDER_ICONS[node.icon] || FOLDER_ICONS.panel;
  return `<div class="folder-card" ${dataAttrs}>
      <div class="fc-inner">
        <div class="fc-icon">${iconSvg}</div>
        <h4>${escapeHtml(node.label)}</h4>
        <div class="fc-count">${count} טפסים</div>
        <div class="fc-arrow">←</div>
      </div>
    </div>`;
}

// Maps a report's group back to the folder route it lives under, so the
// report view's back button returns to the right place instead of always
// jumping to the very top.
function folderRouteForGroup(group){
  if(group==='gen50' || group==='gen660') return {view:'folder', key:'gen', sub:group};
  return {view:'folder', key:group};
}

function draftsBoxHtml(drafts){
  if(!drafts.length){
    return `<div class="drafts-box empty">אין עדיין טיוטות שמורות — טיוטה שתישמר בעת מילוי דוח תופיע כאן ותישאר זמינה גם בפתיחה הבאה.</div>`;
  }
  return `<div class="drafts-box">
      <h4>טיוטות שמורות</h4>
      ${drafts.map(d=>`
        <div class="draft-chip" data-action="open-draft" data-key="${d.key}">
          <span>${escapeHtml(d.title)}</span>
          <small>${escapeHtml(d.savedAt||'')}</small>
          <span class="del" data-action="delete-draft" data-key="${d.key}" title="מחיקת טיוטה">✕</span>
        </div>`).join('')}
    </div>`;
}

async function renderHome(){
  const app = document.getElementById('app');
  const drafts = await listDrafts();
  const foldersHtml = FOLDER_TREE.map(node=>
    folderCardHtml(node, `data-action="open-folder" data-key="${node.key}"`)
  ).join('');

  app.innerHTML = `
    <div class="hero">
      <div class="eyebrow">תיק מתקן חשמל · מט"ש אוג</div>
      <h2>דוחות אחזקת חשמל</h2>
      <p>בחרו תיקייה כדי להגיע לדוחות שבתוכה. לכל דוח קובץ Word ו-PDF מקוריים, כאן הם מאוחדים לטופס דיגיטלי אחד למילוי, ייצוא ל-PDF ושליחה במייל.</p>
    </div>
    ${draftsBoxHtml(drafts)}
    <div class="card-grid folder-grid">${foldersHtml}</div>
  `;
}

async function renderFolder(key, sub){
  const app = document.getElementById('app');
  const node = FOLDER_TREE.find(n=>n.key===key);
  if(!node){ state.route = {view:'home'}; return renderHome(); }

  if(node.children && !sub){
    // Intermediate level: show the subfolders (e.g. inside "גנרטורים")
    const cards = node.children.map(c=>
      folderCardHtml(c, `data-action="open-folder" data-key="${key}" data-sub="${c.key}"`)
    ).join('');
    app.innerHTML = `
      <button class="back-btn" data-action="go-home">→ חזרה לתיקיות</button>
      <div class="hero">
        <div class="eyebrow">תיק מתקן חשמל · מט"ש אוג</div>
        <h2>${escapeHtml(node.label)}</h2>
      </div>
      <div class="card-grid folder-grid">${cards}</div>
    `;
    return;
  }

  // Leaf level: show the actual report cards for this folder/subfolder
  const groupKey = sub || key;
  const leafNode = sub ? node.children.find(c=>c.key===sub) : node;
  const drafts = await listDrafts();
  const reports = REPORTS.filter(r=>r.group===groupKey);
  const cards = reports.map(r=>`
      <div class="report-card" data-action="open-report" data-id="${r.id}">
        <div class="rc-inner">
          <div class="rc-top">
            <div class="rc-icon">${REPORT_ICON}</div>
            <div class="rc-code">
              <span>${escapeHtml(r.docTag)}</span>
              ${drafts.some(d=>d.key==='draft:'+r.id) ? '<span class="draft-flag">טיוטה</span>' : ''}
            </div>
          </div>
          <h4>${escapeHtml(r.title)}</h4>
          <div class="rc-fill">מילוי דוח <span class="arrow">←</span></div>
        </div>
      </div>`).join('');
  const backAttr = sub ? `data-action="open-folder" data-key="${key}"` : `data-action="go-home"`;
  const backLabel = sub ? '→ חזרה לגנרטורים' : '→ חזרה לתיקיות';

  app.innerHTML = `
    <button class="back-btn" ${backAttr}>${backLabel}</button>
    <div class="hero">
      <div class="eyebrow">תיק מתקן חשמל · מט"ש אוג</div>
      <h2>${escapeHtml(leafNode.label)}</h2>
      <p>${reports.length} טפסים בתיקייה זו.</p>
    </div>
    <div class="card-grid">${cards}</div>
  `;
}

/* Rendering: REPORT FORM                                                 */
/* ---------------------------------------------------------------------- */
function fieldId(reportId, si, key){ return `s${si}_${key}`; }

function renderField(reportId, si, fld){
  const vals = ensureValues(reportId);
  const id = fieldId(reportId, si, fld.key);

  if(fld.type==='hourmin'){
    const hId = id+'_h', mId = id+'_m';
    if(vals[hId]===undefined) vals[hId] = '';
    if(vals[mId]===undefined) vals[mId] = '';
    return `<div class="field"><label>${escapeHtml(fld.label)}<span class="req-star">*</span></label>${hourMinHtml(hId, mId, vals[hId], vals[mId])}</div>`;
  }

  if(vals[id]===undefined){
    if(fld.default!==undefined) vals[id] = fld.default;
    else if(fld.auto) vals[id] = autoValue(fld.auto);
    else vals[id] = '';
  }
  const val = vals[id];
  const numAttrs = fld.numeric ? ' inputmode="decimal"' : '';
  let input='';
  if(fld.type==='select'){
    const opts = fld.options||[];
    input = `<select data-field="${id}">
      <option value="">— בחר —</option>
      ${opts.map(o=>`<option value="${escapeAttr(o)}" ${o===val?'selected':''}>${escapeHtml(o)}</option>`).join('')}
    </select>`;
  } else if(fld.type==='textarea'){
    input = `<textarea data-field="${id}">${escapeHtml(val)}</textarea>`;
  } else if(fld.type==='date'){
    input = `<input type="date" data-field="${id}" value="${escapeAttr(val)}">`;
  } else {
    input = `<input type="text"${numAttrs} data-field="${id}" value="${escapeAttr(val)}" placeholder="${escapeAttr(fld.placeholder||'')}">`;
  }
  return `<div class="field"><label>${escapeHtml(fld.label)}<span class="req-star">*</span>${fld.note?` <span title="${escapeAttr(fld.note)}">ℹ️</span>`:''}</label>${input}</div>`;
}

function renderChecklist(reportId, si, section){
  const vals = ensureValues(reportId);
  const hasExtra = section.rows.some(r=>r.extra);
  const hasDateCols = section.rows.some(r=>r.dateCols);
  const rowsHtml = section.rows.map((r, ri)=>{
    const statusId = fieldId(reportId, si, `r${ri}_status`);
    const noteId = fieldId(reportId, si, `r${ri}_note`);
    const extraId = fieldId(reportId, si, `r${ri}_extra`);
    const prevId = fieldId(reportId, si, `r${ri}_prevlab`);
    const nextId = fieldId(reportId, si, `r${ri}_nextlab`);
    if(vals[statusId]===undefined) vals[statusId]='';
    if(vals[noteId]===undefined) vals[noteId]='';
    if(vals[extraId]===undefined) vals[extraId]='';
    if(vals[prevId]===undefined) vals[prevId]='';
    if(vals[nextId]===undefined) vals[nextId]='';
    const opts = r.kind==='exec' ? EXEC_OPTS : STATUS_OPTS;
    const mainNumAttrs = r.numeric ? ' inputmode="decimal"' : '';
    let statusCell;
    if(r.kind==='hourmin'){
      const hId = statusId+'_h', mId = statusId+'_m';
      if(vals[hId]===undefined) vals[hId]='';
      if(vals[mId]===undefined) vals[mId]='';
      statusCell = hourMinHtml(hId, mId, vals[hId], vals[mId]);
    } else if(r.kind==='text' && r.unit){
      statusCell = unitInputHtml(statusId, vals[statusId], r.unit);
    } else if(r.kind==='text'){
      statusCell = `<input type="text"${mainNumAttrs} data-field="${statusId}" value="${escapeAttr(vals[statusId])}">`;
    } else {
      statusCell = statusSelectHtml(reportId, statusId, vals[statusId], opts);
    }
    const statusTdClass = (vals[statusId]==='תקין'||vals[statusId]==='בוצע') ? 'status-cell val-ok' : ((vals[statusId]==='לא תקין'||vals[statusId]==='לא בוצע') ? 'status-cell val-bad' : 'status-cell');
    let extraTd = '';
    if(hasExtra){
      if(r.extra && r.extra.unit){
        extraTd = `<td>${unitInputHtml(extraId, vals[extraId], r.extra.unit, r.extra.numeric?' inputmode="decimal"':'')}</td>`;
      } else if(r.extra){
        const extraNumAttrs = r.extra.numeric ? ' inputmode="decimal"' : '';
        extraTd = `<td><input type="text"${extraNumAttrs} data-field="${extraId}" value="${escapeAttr(vals[extraId])}" placeholder="${escapeAttr(r.extra.label)}"></td>`;
      } else {
        extraTd = `<td class="hint">—</td>`;

    let dateTds='';
    if(hasDateCols){
      dateTds = r.dateCols ? `<td><input type="date" data-field="${prevId}" value="${escapeAttr(vals[prevId])}"></td><td><input type="date" data-field="${nextId}" value="${escapeAttr(vals[nextId])}"></td>` : `<td class="hint">—</td><td class="hint">—</td>`;
    }
    return `<tr>
      <td class="lbl">${escapeHtml(r.label)}${r.hint?`<div class="hint">${escapeHtml(r.hint)}</div>`:''}</td>
      <td class="${statusTdClass}">${statusCell}</td>
      ${extraTd}
      ${dateTds}
      <td><input type="text" data-field="${noteId}" data-optional="true" value="${escapeAttr(vals[noteId])}" placeholder="הערות"></td>
    </tr>`;
  }).join('');

  return `<div class="section">
    <div class="section-title">${escapeHtml(section.title)}<span class="req-star">*</span></div>
    <div class="table-scroll"><table class="rep-table">
      <thead><tr>
        <th style="width:32%">פירוט</th>
        <th style="width:16%">סטטוס</th>
        ${hasExtra?'<th style="width:16%">ערך</th>':''}
        ${hasDateCols?'<th style="width:12%">בדיקה אחרונה</th><th style="width:12%">בדיקה הבאה</th>':''}
        <th>הערות</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>

}

/* Downscale a captured/selected photo before storing it, so drafts and the
   exported PDF stay a reasonable size. */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------------- */
/* Signature pads                                                         */
/* ---------------------------------------------------------------------- */
function setupSignaturePads(reportId){
  document.querySelectorAll('.sig-canvas').forEach(canvas=>{
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(200, rect.width) * ratio;
    canvas.height = 80 * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#12202e';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    const fieldId = canvas.getAttribute('data-sigfield');
    const vals = ensureValues(reportId);
    if(vals[fieldId]){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width/ratio, canvas.height/ratio);
      img.src = vals[fieldId];
    }

    let drawing=false;
    function pos(e){
      const r = canvas.getBoundingClientRect();
      const x = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
      const y = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
      return {x,y};
    }
    function start(e){ drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
    function end(){ if(!drawing) return; drawing=false; vals[fieldId] = canvas.toDataURL('image/png'); canvas.classList.remove('field-invalid'); }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  });
}

/* ---------------------------------------------------------------------- */
/* Utilities                                                              */
/* ---------------------------------------------------------------------- */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------------------------------------------------------------- */
/* Storage (drafts)                                                       */
/* Uses the platform window.storage API when available (e.g. embedded in  */
/* Claude), and falls back to the browser's own localStorage when this    */
/* file is opened directly (double-clicked / downloaded to a phone) —     */
/* which is the normal case for this standalone HTML file.                */
/* ---------------------------------------------------------------------- */
const storageImpl = (typeof window.storage === 'object' && window.storage !== null) ? window.storage : {
  async get(key){
    const v = localStorage.getItem('lh_'+key);
    if(v===null) throw new Error('not found');
    return {key, value:v};
  },
  async set(key, value){
    localStorage.setItem('lh_'+key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem('lh_'+key);
    return {key, deleted:true};
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('lh_')===0){
        const bare = k.slice(3);
        if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
      }
    }
    return {keys, prefix};
  }
};

async function listDrafts(){
  try{
    const res = await storageImpl.list('draft:', false);
    if(!res || !res.keys) return [];
    const out = [];
    for(const k of res.keys){
      try{
        const item = await storageImpl.get(k, false);
        if(item && item.value){
          const parsed = JSON.parse(item.value);
          out.push({key:k, title:parsed.title||k, savedAt:parsed.savedAt||''});
        }
      }catch(e){ /* skip unreadable */ }
    }
    return out;
  }catch(e){ return []; }
}

async function saveDraft(reportId){
  const report = getReport(reportId);
  const key = `draft:${reportId}`;
  const payload = { title: report.title, savedAt: new Date().toLocaleString('he-IL'), values: state.values[reportId] || {} };
  try{
    const res = await storageImpl.set(key, JSON.stringify(payload), false);
    if(res){
      document.getElementById('statusNote').textContent = `טיוטה נשמרה — ${payload.savedAt}`;
      showToast('הטיוטה נשמרה בהצלחה 💾');
    } else {
      showToast('שמירת הטיוטה נכשלה, נסו שוב');
    }
  }catch(e){ showToast('שמירת הטיוטה נכשלה, נסו שוב'); }
}

async function openDraft(key){
  try{
    const item = await storageImpl.get(key, false);
    if(item && item.value){
      const parsed = JSON.parse(item.value);
      const reportId = key.replace('draft:','');
      const report = getReport(reportId);
      state.values[reportId] = parsed.values || {};
      state.returnRoute = report ? folderRouteForGroup(report.group) : {view:'home'};
      state.route = {view:'report', id: reportId};
      render();
      showToast('הטיוטה נטענה');
    }
  }catch(e){ showToast('לא ניתן היה לטעון את הטיוטה'); }
}

async function deleteDraft(key){
  try{
    await storageImpl.delete(key, false);
    showToast('הטיוטה נמחקה');
    render();
  }catch(e){ showToast('מחיקת הטיוטה נכשלה'); }
}


/* ---------------------------------------------------------------------- */
/* Required-field validation — every field in the printed report must be  */
/* filled before it can be exported or sent.                              */
/* ---------------------------------------------------------------------- */
function validateReport(reportId){
  const root = document.getElementById('report-print-area');
  const invalidEls = [];

  // Plain fields (text/date/time/select/textarea) — required, except notes
  // fields (marked data-optional) which are never mandatory.
  root.querySelectorAll('[data-field]').forEach(el=>{
    if(el.hasAttribute('data-optional')) return;
    if(!el.value || !el.value.trim()) invalidEls.push(el);
  });

  // Dynamic log-table rows: a fully untouched row is ignored, but a row the
  // person started filling in must be completed across its required columns
  // (its notes column, if any, stays optional even then).
  const logGroups = {};
  root.querySelectorAll('[data-logfield]').forEach(el=>{
    const parts = el.getAttribute('data-logfield').split('|');
    const gk = parts[0]+'|'+parts[1];
    (logGroups[gk] = logGroups[gk]||[]).push(el);
  });
  Object.values(logGroups).forEach(cells=>{
    const anyFilled = cells.some(el=>el.value && el.value.trim());
    if(anyFilled) cells.forEach(el=>{ if(!el.hasAttribute('data-optional') && (!el.value || !el.value.trim())) invalidEls.push(el); });
  });

  // Signatures — required wherever a signature pad appears in the report.
  const vals = ensureValues(reportId);
  root.querySelectorAll('.sig-canvas[data-sigfield]').forEach(canvas=>{
    if(!vals[canvas.getAttribute('data-sigfield')]) invalidEls.push(canvas);
  });

  return invalidEls;
}

function markInvalid(invalidEls){
  invalidEls.forEach(el=>el.classList.add('field-invalid'));
  if(invalidEls[0]){
    invalidEls[0].scrollIntoView({behavior:'smooth', block:'center'});
    if(invalidEls[0].focus) invalidEls[0].focus({preventScroll:true});
  }
}

function requireCompleteOrWarn(reportId){
  const invalid = validateReport(reportId);
  if(invalid.length){
    markInvalid(invalid);
    showToast(`נשארו ${invalid.length} שדות חובה למילוי — סומנו באדום`);
    return false;
  }
  return true;
}

/* ---------------------------------------------------------------------- */
/* PDF export — assembled block-by-block (not one giant screenshot) so    */
/* pages have real margins and tables/sections never get sliced mid-row.  */
/* ---------------------------------------------------------------------- */
// A checklist/log/panels-table section is usually taller than one page — that used
// to be handled by screenshotting the whole section and cutting the image at a fixed
// pixel height, which sliced straight through rows and read exactly like a raw
// screenshot dropped onto pages rather than a formatted document. The header and
// each row are now rendered as their own small flow blocks instead, so a page break
// only ever falls between rows, with the header redrawn at the top of every
// continuation page. Each is rendered directly off the LIVE table (never cloned or
// moved) — html2canvas renders any element in place at its own natural size, which
// keeps every column's width identical between the header and every row for free,
// and keeps whatever the person actually typed/selected without a manual copy step.
function withActionsHidden(el, fn){
  const hidden = Array.from(el.querySelectorAll('[data-action]'));
  hidden.forEach(b => { b.dataset.pdfHidden = b.style.visibility; b.style.visibility = 'hidden'; });
  return Promise.resolve(fn()).finally(() => {
    hidden.forEach(b => { b.style.visibility = b.dataset.pdfHidden; delete b.dataset.pdfHidden; });
  });
}

async function buildPdfBlob(reportId){
  const report = getReport(reportId);
  const root = document.getElementById('report-print-area');
  const blocks = Array.from(root.querySelectorAll('.pdf-block, .section'));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pageW = 210, pageH = 297;
  const marginX = 14, marginTop = 14, marginBottom = 16;
  const contentW = pageW - marginX*2;
  const maxY = pageH - marginBottom;
  let cursorY = marginTop;
  let firstBlockOnPage = true;

  // Renders one detached element as a high-res image at the current page cursor,
  // starting a new page first if it doesn't fit — shared by every block below so
  // page-break behavior (and never a blank leading page) stays identical everywhere.
  async function placeElement(el, gap, onNewPage){
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgH = canvas.height * contentW / canvas.width;
    if(!firstBlockOnPage && (cursorY + imgH) > maxY){
      pdf.addPage();
      cursorY = marginTop;
      firstBlockOnPage = true;
      if(onNewPage) await onNewPage();
    }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginX, cursorY, contentW, imgH);
    cursorY += imgH + gap;
    firstBlockOnPage = false;
  }

  for(const el of blocks){
    const tableScroll = el.querySelector(':scope > .table-scroll');
    const table = tableScroll ? tableScroll.querySelector('table.rep-table') : null;

    if(table){
      const before = document.createElement('div');
      Array.from(el.childNodes).forEach(n => {
        if(n === tableScroll) return;
        if(n.nodeType === 1 && n.classList.contains('row-actions-bar')) return; // "+ הוספת שורה" — not for print
        before.appendChild(n.cloneNode(true));
      });
      if(before.childNodes.length) await placeElement(before, 4);

      const thead = table.querySelector('thead');
      const rows = Array.from(table.querySelectorAll('tbody > tr'));

      async function renderHeaderStandalone(){
        if(thead) await placeElement(thead, 0);
      }
      if(thead && rows.length) await renderHeaderStandalone();

      for(const row of rows){
        // The ✕ delete-row button is meaningless on a printed page — hidden for
        // just this one render, then restored, rather than built as a fresh
        // element without it (this row is rendered live, in place, not cloned).
        await withActionsHidden(row, () => placeElement(row, 0, thead ? renderHeaderStandalone : null));
      }
      cursorY += 5;
      continue;
    }

    // Not a table section (a field grid, notes/photos, or the signoff block) —
    // one screenshot of the whole block, same as before. Still falls back to a
    // raw pixel slice if it alone is taller than a full page (e.g. many photos),
    // since there's no row-like boundary to break at here.
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgH = canvas.height * contentW / canvas.width;

    if(!firstBlockOnPage && (cursorY + imgH) > maxY){
      pdf.addPage();
      cursorY = marginTop;
      firstBlockOnPage = true;
    }

    if(imgH > (maxY - marginTop)){
      const pxPerMm = canvas.width / contentW;
      const pageContentPx = (maxY - marginTop) * pxPerMm;
      let sy = 0;
      let remainingPx = canvas.height;
      let isFirstSlice = true;
      while(remainingPx > 0){
        if(!isFirstSlice || !firstBlockOnPage){ pdf.addPage(); cursorY = marginTop; }
        const slicePx = Math.min(pageContentPx, remainingPx);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = slicePx;
        const ctx = sliceCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,sliceCanvas.width, sliceCanvas.height);
        ctx.drawImage(canvas, 0, sy, canvas.width, slicePx, 0, 0, canvas.width, slicePx);
        const sliceImgH = slicePx / pxPerMm;
        pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginX, marginTop, contentW, sliceImgH);
        cursorY = marginTop + sliceImgH;
        sy += slicePx;
        remainingPx -= slicePx;
        isFirstSlice = false;
        firstBlockOnPage = false;
      }
    } else {
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginX, cursorY, contentW, imgH);
      cursorY += imgH + 5;
      firstBlockOnPage = false;
    }
  }

  // Footer on every page: thin rule + report title + page numbers.
  // Rendered via the DOM (not jsPDF's native text()) because jsPDF's built-in
  // fonts have no Hebrew glyphs — anything drawn with pdf.text() in Hebrew
  // would come out blank.
  const pageCount = pdf.internal.getNumberOfPages();
  const footerHost = document.createElement('div');
  footerHost.style.position = 'fixed';
  footerHost.style.left = '-9999px';
  footerHost.style.top = '0';
  footerHost.style.width = '900px';
  footerHost.style.direction = 'rtl';
  footerHost.style.fontFamily = "'Rubik','Heebo',sans-serif";
  footerHost.style.fontSize = '15px';
  footerHost.style.color = '#5b6577';
  footerHost.style.borderTop = '1.5px solid #365198';
  footerHost.style.paddingTop = '6px';
  footerHost.style.display = 'flex';
  footerHost.style.justifyContent = 'space-between';
  footerHost.style.background = '#ffffff';
  document.body.appendChild(footerHost);

  for(let p=1; p<=pageCount; p++){
    footerHost.innerHTML = `
      <span>מט"ש אוג · ${escapeHtml(report.title)}</span>
      <span>עמוד ${p} מתוך ${pageCount}</span>
      <span>${escapeHtml(todayStr())}</span>
    `;
    const fCanvas = await html2canvas(footerHost, {scale:2, backgroundColor:'#ffffff'});
    const fImgH = fCanvas.height * contentW / fCanvas.width;
    pdf.setPage(p);
    pdf.addImage(fCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', marginX, pageH - marginBottom + 3, contentW, fImgH);
  }
  footerHost.remove();

  const filename = report.title.replace(/["'/\\]/g,'') + '.pdf';
  const blob = pdf.output('blob');
  return {blob, filename};
}

async function exportPdf(reportId){
  showToast('מכין קובץ PDF...');
  const {blob, filename} = await buildPdfBlob(reportId);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  state.exportedOnce[reportId] = true;
  return filename;
}

function mailtoFallback(reportId, filename){
  const report = getReport(reportId);
  const to = REPORT_RECIPIENTS.join(',');
  const subject = encodeURIComponent(`${report.title} — מט"ש אוג — ${todayStr()}`);
  const body = encodeURIComponent(
    `מצורף דוח מולא: ${report.title}\n` +
    `תאריך: ${todayStr()}\n\n` +
    `* קובץ ה-PDF ("${filename}") הורד כעת למכשיר — יש לצרף אותו למייל זה לפני השליחה (דפדפן אינו יכול לצרף קבצים אוטומטית בשיטה זו).`
  );
  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
}

// Single "send" action: share the PDF directly with the file already
// attached (native share sheet — Mail/Gmail/WhatsApp/AirDrop/etc.), and the
// person adds recipients themselves once their app of choice opens. Only
// falls back to a plain download + mailto (recipients pre-filled) on
// browsers that don't support sharing files at all.
async function shareOrEmailPdf(reportId){
  const report = getReport(reportId);
  showToast('מכין קובץ PDF...');
  const {blob, filename} = await buildPdfBlob(reportId);
  const file = new File([blob], filename, {type:'application/pdf'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title: report.title,
        text: `דוח מולא: ${report.title} — מט"ש אוג — ${todayStr()}`,
      });
      state.exportedOnce[reportId] = true;
      return;
    }catch(err){
      if(err && err.name==='AbortError') return; // user cancelled the share sheet — do nothing further
      // otherwise fall through to the download+mailto fallback below
    }
  }

  // Fallback (desktop browsers / no share-with-files support): download the
  // PDF and open the mail client with the three recipients pre-filled.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  state.exportedOnce[reportId] = true;
  showToast(`הקובץ "${filename}" הורד — נפתחת תוכנת המייל...`);
  setTimeout(()=>mailtoFallback(reportId, filename), 900);
}


/* ---------------------------------------------------------------------- */
/* Event delegation                                                       */
/* ---------------------------------------------------------------------- */
document.addEventListener('input', (e)=>{
  const t = e.target;
  const reportId = state.route.id;
  if(!reportId) return;
  if(t.matches('[data-field]')){
    const vals = ensureValues(reportId);
    vals[t.getAttribute('data-field')] = t.value;
    if(t.value && t.value.trim()) t.classList.remove('field-invalid');
    if(t.classList.contains('status-select')){
      t.classList.remove('val-ok','val-bad');
      if(t.value==='תקין'||t.value==='בוצע') t.classList.add('val-ok');
      if(t.value==='לא תקין'||t.value==='לא בוצע') t.classList.add('val-bad');
      const td = t.closest('td');
      if(td){ td.classList.remove('val-ok','val-bad'); if(t.value==='תקין'||t.value==='בוצע') td.classList.add('val-ok'); if(t.value==='לא תקין'||t.value==='לא בוצע') td.classList.add('val-bad'); }
    }
  } else if(t.matches('[data-logfield]')){
    const [rowsKey, ri, key] = t.getAttribute('data-logfield').split('|');
    const vals = ensureValues(reportId);
    if(!vals[rowsKey]) vals[rowsKey]=[];
    if(!vals[rowsKey][ri]) vals[rowsKey][ri]={};
    vals[rowsKey][ri][key] = t.value;
    if(t.value && t.value.trim()) t.classList.remove('field-invalid');
  }
});
document.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.matches('select[data-field]')){
    // trigger same handling as input for select (change fires, input listener above already covers value+class via 'input' event in most browsers,
    // but selects emit 'change' not 'input' reliably in all browsers — handle here too)
    const reportId = state.route.id;
    if(!reportId) return;
    const vals = ensureValues(reportId);
    vals[t.getAttribute('data-field')] = t.value;
    if(t.value && t.value.trim()) t.classList.remove('field-invalid');
    t.classList.remove('val-ok','val-bad');
    if(t.value==='תקין'||t.value==='בוצע') t.classList.add('val-ok');
    if(t.value==='לא תקין'||t.value==='לא בוצע') t.classList.add('val-bad');
    const td = t.closest('td');
    if(td){ td.classList.remove('val-ok','val-bad'); if(t.value==='תקין'||t.value==='בוצע') td.classList.add('val-ok'); if(t.value==='לא תקין'||t.value==='לא בוצע') td.classList.add('val-bad'); }
    return;
  }
  if(t.matches('[data-photoinput]')){
    const reportId = state.route.id;
    if(!reportId || !t.files || !t.files[0]) return;
    const si = t.getAttribute('data-photoinput');
    const file = t.files[0];
    showToast('מוסיף תמונה...');
    resizeImageFile(file, 1400, 0.8).then(dataUrl=>{
      const vals = ensureValues(reportId);
      const photosKey = `s${si}_photos`;
      if(!vals[photosKey]) vals[photosKey] = [];
      vals[photosKey].push(dataUrl);
      render();
    }).catch(()=>{ showToast('לא ניתן היה לצרף את התמונה, נסו שוב'); });
    return;
  }
});

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action==='go-home'){ state.route = {view:'home'}; render(); return; }

  if(action==='share-link'){
    const shareUrl = location.origin + location.pathname;
    const shareData = { title: document.title, text: 'טפסי אחזקת חשמל — מט"ש אוג', url: shareUrl };
    // navigator.share opens the phone's own share sheet (WhatsApp, email, etc.) straight
    // to this page's link — the natural way to hand this to a teammate on mobile. Desktop
    // browsers mostly don't support it, so there the link is just copied to the clipboard
    // instead, with a toast confirming it's ready to paste.
    if(navigator.share){
      try{ await navigator.share(shareData); return; }catch(e){ /* user cancelled the share sheet — fall through to copy */ }
    }
    try{
      await navigator.clipboard.writeText(shareUrl);
      showToast('הקישור הועתק — אפשר להדביק ולשלוח 🔗');
    }catch(e){
      prompt('העתיקו את הקישור לשיתוף:', shareUrl);
    }
    return;
  }

  if(action==='send-feedback'){
    const routeLabel = state.route.view==='report' ? (getReport(state.route.id)||{}).title || state.route.id : state.route.view;
    const subject = encodeURIComponent('דיווח על באג — דוחות אחזקת חשמל');
    const body = encodeURIComponent(
      `שלום,\n\nמצאתי בעיה באפליקציית דוחות אחזקת חשמל:\n\n[תארו כאן מה קרה, ובאיזה שלב]\n\n---\nמסך: ${routeLabel}\nתאריך: ${todayStr()}`
    );
    window.location.href = `mailto:${FEEDBACK_EMAIL}?subject=${subject}&body=${body}`;
    return;
  }

  if(action==='go-back'){ state.route = state.returnRoute || {view:'home'}; render(); return; }

  if(action==='open-folder'){
    const key = el.getAttribute('data-key');
    const sub = el.getAttribute('data-sub') || undefined;
    state.route = {view:'folder', key, sub};
    render(); return;
  }

  if(action==='open-report'){
    const reportId = el.getAttribute('data-id');
    // Remember where we were so the report's back button returns here.
    state.returnRoute = state.route.view==='report' ? (state.returnRoute || {view:'home'}) : state.route;
    state.route = {view:'report', id: reportId};
    render(); return;
  }

  if(action==='open-draft'){ await openDraft(el.getAttribute('data-key')); return; }
  if(action==='delete-draft'){ e.stopPropagation(); await deleteDraft(el.getAttribute('data-key')); return; }

  if(action==='save-draft'){ await saveDraft(el.getAttribute('data-id')); return; }

  if(action==='export-pdf'){
    const reportId = el.getAttribute('data-id');
    if(!requireCompleteOrWarn(reportId)) return;
    el.disabled = true;
    try{ const fn = await exportPdf(reportId); showToast(`הקובץ "${fn}" הורד בהצלחה`); }
    catch(err){ showToast('שגיאה בייצוא ה-PDF, נסו שוב'); console.error(err); }
    el.disabled = false;
    return;
  }

  if(action==='export-email'){
    const reportId = el.getAttribute('data-id');
    if(!requireCompleteOrWarn(reportId)) return;
    el.disabled = true;
    try{ await shareOrEmailPdf(reportId); }
    catch(err){ showToast('שגיאה בייצוא, נסו שוב'); console.error(err); }
    el.disabled = false;
    return;
  }

  if(action==='add-row'){
    const si = el.getAttribute('data-section');
    const reportId = state.route.id;
    const vals = ensureValues(reportId);
    const rowsKey = `s${si}_rows`;
    if(!vals[rowsKey]) vals[rowsKey]=[];
    vals[rowsKey].push({});
    render(); return;
  }
  if(action==='rm-row'){
    const si = el.getAttribute('data-section');
    const ri = parseInt(el.getAttribute('data-row'),10);
    const reportId = state.route.id;
    const vals = ensureValues(reportId);
    const rowsKey = `s${si}_rows`;
    if(vals[rowsKey]) vals[rowsKey].splice(ri,1);
    render(); return;
  }
  if(action==='clear-sig'){
    const canvasId = el.getAttribute('data-canvas');
    const fieldName = el.getAttribute('data-sigfieldref');
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const reportId = state.route.id;
    ensureValues(reportId)[fieldName] = '';
    return;
  }

  if(action==='remove-photo'){
    const si = el.getAttribute('data-section');
    const pi = parseInt(el.getAttribute('data-photo'),10);
    const reportId = state.route.id;
    const vals = ensureValues(reportId);
    const photosKey = `s${si}_photos`;
    if(vals[photosKey]) vals[photosKey].splice(pi,1);
    render();
    return;
  }
});

/* ---------------------------------------------------------------------- */
/* Router / init                                                          */
/* ---------------------------------------------------------------------- */
function render(){
  if(state.route.view==='home'){ renderHome(); }
  else if(state.route.view==='folder'){ renderFolder(state.route.key, state.route.sub); }
  else { renderReport(state.route.id); }
}
document.getElementById('letterhead').innerHTML = letterheadHtml();

// Favicon / home-screen icon — a plain, serious mark (navy square + white
// clipboard/report glyph), not the colorful plant logo. Drawn entirely on a
// canvas, no photo/logo compositing, to keep it corporate and simple.
(function setFavicon(){
  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function setLinkIcon(rel, href){
    let link = document.querySelector(`link[rel="${rel}"]`);
    if(!link){ link=document.createElement('link'); link.rel=rel; document.head.appendChild(link); }
    link.type='image/png';
    link.href = href;
  }

  const size = 192;
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');

    // plain white rounded card behind the mark, kept simple and corporate
    ctx.fillStyle = '#ffffff';
    roundRectPath(ctx, 0, 0, size, size, size*0.2);
    ctx.fill();
    ctx.strokeStyle = '#dfe4ee';
    ctx.lineWidth = 2;
    ctx.stroke();

    const markSize = size*0.78;
    ctx.drawImage(img, (size-markSize)/2, (size-markSize)/2, markSize, markSize);

    const dataUrl = canvas.toDataURL('image/png');
    setLinkIcon('icon', dataUrl);
    setLinkIcon('apple-touch-icon', dataUrl);
  };
  img.onerror = function(){
    setLinkIcon('icon', FAVICON_LOGO_SRC);
    setLinkIcon('apple-touch-icon', FAVICON_LOGO_SRC);
  };
  img.src = FAVICON_LOGO_SRC;
})();

render();
