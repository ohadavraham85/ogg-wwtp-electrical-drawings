<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OhadCad</title>
<style>
:root{--toph:64px;--bg:#1e1e1e;--card:#232323;--card2:#3a3a3a;--line:#4a4a4a;--txt:#f2f2f2;--mut:#a3a3a3;--acc:#1e88ff;--fab:#0b0b0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#stage{position:fixed;inset:0;background-color:#262626;touch-action:none}
#svg{width:100%;height:100%;display:block;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none}
.card{background:var(--card);border:1px solid #3c3c3c;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;height:var(--toph);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:6}
#selInfo{display:flex;align-items:center;gap:10px;min-width:70px;flex:1 1 70px}
#selThumb{width:38px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
#selThumb svg{max-width:100%;max-height:100%}
#selName{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:4px;direction:ltr;flex:none}
.tb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.tb:disabled{opacity:.28}
.tb.on{background:#1e3a5f}
.tb svg,.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;width:56px;height:56px;border-radius:14px;background:var(--fab);display:flex;align-items:center;justify-content:center;z-index:4;border:1px solid #2c2c2c}
.fab.on{background:#7c2d12}
.col{position:fixed;display:flex;flex-direction:column;gap:10px;z-index:4}
.col .fab{position:static}
#dock{position:absolute;bottom:100%;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-bottom:8px;pointer-events:none}
.pill{pointer-events:auto;display:flex;background:#0b0b0b;border:1px solid #333;border-radius:16px;padding:3px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.pb{width:48px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px}
.pb:active{background:#2a2a2a}.pb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pb span{font-size:10.5px;color:#cfcfcf;line-height:1}.pb b{font-size:13px;height:22px;display:flex;align-items:center}
.pb.dng svg{stroke:#f87171}.pb.on{background:#7c2d12}
#rail{display:flex;flex-direction:row;align-items:center;gap:2px;flex:0 1 auto;min-width:0;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;direction:rtl}
#rail::-webkit-scrollbar{display:none}
@media (max-width:700px){:root{--toph:118px}
 #top{flex-wrap:wrap;align-content:center;row-gap:0;padding:2px 6px}
 #top>.sep{display:none}
 #bMenu{order:1}#selInfo{order:2}#top>.tbtns{order:3}
 #rail{order:4;flex:1 0 100%;height:58px;justify-content:space-between;border-top:1px solid #333}
 #rail .rb{width:auto;min-width:40px;flex:1 0 auto;height:54px;padding:0 1px}
 #rail .rb span{font-size:10px}#rail .rb svg{width:22px;height:22px}
 #rail .sep{margin:0 1px;height:30px}
 #rail.more{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 44px);mask-image:linear-gradient(to right,transparent 0,#000 44px)}}
.rb{width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;flex:none}
.rb:active{background:#2a2a2a}.rb svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb span{font-size:11px;color:#d4d4d4;line-height:1}.rb b{font-size:15px;height:25px;display:flex;align-items:center}
.rb.on{background:var(--acc)}.rb.on span{color:#fff}.rb:disabled{opacity:.28}.rb.dng svg{stroke:#f87171}
.sep{width:1px;height:34px;background:#444;margin:0 4px;flex:none}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + var(--toph) + 18px);bottom:10px;width:min(360px,calc(100vw - 20px));background:#1e1e1e;border:1px solid #3a3a3a;border-radius:18px;z-index:7;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.65);transition:transform .2s,opacity .2s}
#panel.hidden{transform:translateX(24px);opacity:0;pointer-events:none}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;flex:none}.phead b{font-size:18px}
#pClose{width:40px;height:40px;border-radius:10px;background:#333;font-size:17px}
#libWrap{display:flex;flex-direction:column;min-height:0;flex:1}
#search{margin:0 12px 8px;width:auto;flex:none}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 6px;overflow:visible;flex:none}
#tabs .tab{padding:8px 12px;font-size:14px;border-radius:18px}
#sheetBody{overflow-y:auto;padding:0 12px 16px;flex:1}
#sheetBody .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
#sheetBody .item{min-height:108px;border-radius:14px}
#sheetBody .chip{width:44px;height:32px}
#propsBody{overflow-y:auto;padding:4px 14px 18px;flex:1}
#wireBar{position:fixed;left:10px;right:10px;bottom:10px;background:#121212;border:1px solid #333;border-radius:16px;padding:10px;z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#wireBar.hidden{display:none}
#wireBar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#wireBar .row+.row{margin-top:8px}
#wireBar .wc{width:30px;height:30px;border-radius:50%;border:3px solid #555}#wireBar .wc.on{border-color:#fff}
#wireBar select{width:auto;padding:7px}#wireBar .wbtn{padding:8px 11px;font-size:14px}
#panel.half{top:52vh}
#selInfo{cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;height:42vh;background:var(--card);border-radius:22px 22px 0 0;z-index:6;display:flex;flex-direction:column;transition:transform .25s;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(0,0,0,.45)}
#sheet.col2{transform:translateY(calc(100% - 100px))}
.tab.wire{display:flex;align-items:center;gap:6px}.tab.wire svg{width:20px;height:20px}
#handle{height:34px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;touch-action:none;cursor:ns-resize}
#bSheet{position:absolute;left:10px;top:2px;height:30px;padding:0 12px;border-radius:15px;background:#3a3a3a;font-size:13px;display:flex;align-items:center;gap:4px}
#handle span{width:48px;height:5px;border-radius:3px;background:#777}
#tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 10px;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:#4a4a4a;border-radius:24px;padding:11px 20px;font-size:16px;white-space:nowrap}
.tab.on{background:var(--acc)}
#sheetBody{overflow-y:auto;padding:0 12px 20px;flex:1}
.grp{font-size:18px;margin:10px 4px 10px}
.chips{display:flex;gap:10px;margin:0 2px 12px;flex-wrap:wrap}
.chip{width:58px;height:36px;border-radius:8px;border:3px solid #555}
.chip.on{border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item{background:#474747;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
.item:active{background:#5a5a5a}
.item .th{height:72px;width:100%;display:flex;align-items:center;justify-content:center}
.item .th svg{max-height:72px;max-width:92%}
.item .nm{font-size:13.5px;text-align:center;line-height:1.2;direction:ltr}
.item .nm.he{direction:rtl}
#wirePanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wbtn{background:#4a4a4a;border-radius:12px;padding:11px 14px;font-size:15px}
.wbtn.pri{background:var(--acc)}
.wbtn.on{background:#166534}
.hint{color:var(--mut);font-size:14px;line-height:1.5;margin:4px 2px 12px}
select,input,textarea{font:inherit;background:#2d2d2d;color:#fff;border:1px solid #555;border-radius:10px;padding:10px;width:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hidden,#drawer.hidden{display:none}
.mbox{background:#262626;border:1px solid #444;border-radius:18px;width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column}
.mbox h3{margin:0;padding:16px 18px 6px;font-size:19px}
.mbody{padding:8px 18px;overflow:auto;flex:1}
.mbtns{display:flex;gap:10px;padding:12px 18px 16px;flex-wrap:wrap}
.mbtns button{flex:1;background:#444;border-radius:12px;padding:12px;font-size:16px;min-width:90px}
.mbtns button.pri{background:var(--acc)}
.mbtns button.dng{background:#991b1b}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid #3a3a3a;padding:8px 4px;text-align:right}
#drawer{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5)}
#drawer .dbox{position:absolute;top:0;bottom:0;right:0;width:280px;max-width:84vw;background:#232323;padding:calc(env(safe-area-inset-top) + 18px) 12px 18px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#drawer .dbox h2{font-size:18px;margin:0 8px 12px}
#drawer .dbox button{text-align:right;padding:11px 12px;border-radius:10px;font-size:16px}
#drawer .dbox button:active{background:#3a3a3a}
.plist button{display:block;width:100%;text-align:right;background:#333;border-radius:10px;padding:12px;margin-bottom:8px}
#rulX{position:fixed;left:20px;right:0;bottom:0;height:20px;background:rgba(14,14,14,.88);border-top:1px solid #3a3a3a;z-index:3;overflow:hidden;pointer-events:none;direction:ltr}
#rulY{position:fixed;left:0;top:0;bottom:20px;width:20px;background:rgba(14,14,14,.88);border-right:1px solid #3a3a3a;z-index:3;overflow:hidden;pointer-events:none;direction:ltr}
#rulX i,#rulY i{position:absolute;background:#8a8a8a;display:block}#rulX b,#rulY b{position:absolute;font:600 10px Arial;color:#c9c9c9;white-space:nowrap}
#rulX .cur,#rulY .cur{background:#f43f5e}
#coord{position:fixed;left:28px;bottom:28px;z-index:3;background:rgba(14,14,14,.88);border:1px solid #3a3a3a;border-radius:10px;padding:4px 9px;font:600 12px Arial;color:#e5e5e5;direction:ltr;pointer-events:none}
body.noaxes #rulX,body.noaxes #rulY,body.noaxes #coord{display:none}
#docTabs{position:fixed;left:28px;top:calc(env(safe-area-inset-top) + var(--toph) + 18px);z-index:5;display:flex;background:#0b0b0b;border:1px solid #333;border-radius:14px;padding:3px;gap:2px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#docTabs button{padding:8px 12px;border-radius:11px;font-size:14px;color:#cfcfcf;white-space:nowrap}#docTabs button.on{background:var(--acc);color:#fff}#docTabs #bDark,#docTabs #bLayout{padding:8px 9px}#docTabs #bLayout.on{background:#3a3a3a;box-shadow:inset 0 0 0 1.5px var(--acc)}#saveSt{align-self:center;padding:0 8px;font-size:12.5px;color:#9ca3af;white-space:nowrap}#saveSt[data-k=saved]{color:#4ade80}#saveSt[data-k=error]{color:#f87171}#docTabs #bDark.on{background:#3a3a3a}
body.sld #stage{background-color:#efefeb}
.item .th.lt{background:#f7f7f3;border-radius:8px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + var(--toph) + 26px);transform:translateX(-50%);background:#111;border:1px solid #444;padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
/* ---- component library layout ---- */
#libBody{display:flex;flex-direction:column;min-height:0;flex:1}
#tabs{flex-wrap:nowrap!important;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 12px 8px}
#tabs .tab{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13.5px;border-radius:16px;background:#3a3a3a;white-space:nowrap;flex:none}
#tabs .tab .ti{font-size:14px;opacity:.9;width:16px;text-align:center}#tabs .tab.on{background:var(--acc)}
#sheetBody .grp{position:sticky;top:0;z-index:1;background:#1e1e1e;font-size:14.5px;font-weight:700;color:#e5e5e5;margin:0 -2px 8px;padding:10px 4px 6px;border-bottom:1px solid #333}
#sheetBody .hint{font-size:12.5px;line-height:1.5;background:#262626;border-radius:10px;padding:8px 10px;margin:2px 0 6px}
#sheetBody .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:6px}
#sheetBody .item{min-height:100px;padding:8px 4px 6px}#sheetBody .item .th{height:60px}#sheetBody .item .th svg{max-height:60px}
#sheetBody .item .nm{font-size:12.5px;line-height:1.25}
@media (min-width:900px){
 #panel.lib{width:min(620px,calc(100vw - 20px))}
 #libBody{flex-direction:row}
 #tabs{flex-direction:column;overflow-x:hidden;overflow-y:auto;width:150px;flex:none;padding:0 10px 12px 8px;border-left:1px solid #333}
 #tabs .tab{border-radius:10px;padding:10px 10px;white-space:normal;text-align:right;line-height:1.25;background:transparent}
 #tabs .tab:hover{background:#2c2c2c}#tabs .tab.on{background:var(--acc)}
 #sheetBody{padding:0 12px 16px 12px}}
</style>
</head>
<body>
<div id="stage"><svg id="svg"><g id="world"></g></svg></div>

<div id="rulX"></div><div id="rulY"></div><div id="coord"></div>
<div id="docTabs"><button data-doc="panel">🗄 חזית לוח</button><button data-doc="sld">⚡ חד קווי</button><button data-doc="both">◧ משולב</button><button id="bDark" title="חד קווי: רקע שחור / דף לבן">🌙</button><button id="bLayout" title="הצג / הסתר את דף הייצור (Layout)">📄</button><span id="saveSt"></span></div>
<div id="top" class="card">
  <button class="tb" id="bMenu" title="תפריט"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div id="selInfo" title="מאפיינים"><div id="selThumb"></div><div id="selName"></div></div>
  <div id="rail">
    <button class="rb" id="rAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>הוסף</span></button>
    <button class="rb" id="rWire"><svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 22v-8" stroke="#777" style="stroke-width:5"/><path d="M11 14c-1-5-4-8-7-10" stroke="#e53935"/><path d="M12 14c0-5 0-8 1-11" stroke="#43a047"/><path d="M13 14c1-5 4-8 7-9" stroke="#1e88e5"/></svg><span>חיווט</span></button>
    <button class="rb" id="rProps"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>מאפיינים</span></button>
    <button class="rb" id="bText" title="הוסף תיבת טקסט לרכיב שנבחר"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9.5h8M12 9.5v6"/></svg><span>טקסט</span></button>
    <div class="sep"></div>
    <button class="rb" id="bDup"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="1.5"/><path d="M5 16V4.5A1.5 1.5 0 0 1 6.5 3H16"/></svg><span>שכפול</span></button>
    <button class="rb" id="bRot"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.6h-4.6"/></svg><span>סיבוב</span></button>
    <button class="rb" id="bLock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5" fill="#fff"/><path id="lockShackle" d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg><span id="lockLbl">נעילה</span></button>
    <button class="rb dng" id="bDel"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13"/></svg><span>מחיקה</span></button>
    <div class="sep"></div>
    <button class="rb" id="bFit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>הכל</span></button>
    <button class="rb" id="bGrid"><b id="gridLbl"></b><span>גריד</span></button>
    <div class="sep"></div>
    <button class="rb" id="bDoor" title="דלת הלוח: פנים / חזית"><svg viewBox="0 0 24 24"><path d="M6 21V3.5h12V21"/><path d="M3.5 21h17"/><circle cx="15" cy="12.5" r="1" fill="#fff"/></svg><span id="doorLbl">חזית</span></button>
    <button class="rb" id="bLockAll" title="נעל עריכה (צפייה בלבד)"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg><span>צפייה</span></button>
    <button class="rb" id="bHelp" title="עזרה"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5"/><circle cx="12" cy="17.2" r=".6" fill="#fff"/></svg><span>עזרה</span></button>
  </div>
  <div class="sep"></div>
  <div class="tbtns">
    <button class="tb" id="bRedo" title="בצע שוב"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="tb" id="bUndo" title="בטל"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  </div>
</div>


<div id="panel" class="hidden">
  <div class="phead"><b id="pTitle"></b><button id="pClose">✕</button></div>
  <div id="libWrap"><input id="search" placeholder="🔍 חיפוש רכיב…" autocomplete="off"><div id="libBody"><div id="tabs"></div><div id="sheetBody"></div></div></div>
  <div id="propsBody"></div>
</div>
<div id="wireBar" class="hidden"></div>

<div id="drawer" class="hidden"><div class="dbox" id="dbox"></div></div>
<div id="modal" class="hidden"><div class="mbox"><h3 id="mTitle"></h3><div class="mbody" id="mBody"></div><div class="mbtns" id="mBtns"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= constants ================= */
const M=18; // DIN module width (mm)
const COLORS={red:'#c62828',green:'#1f9d55',blue:'#1d5fd1',orange:'#c26a12',olive:'#9a961c',yellow:'#e8b800',white:'#f2f2ee',grey:'#6b7280',black:'#222'};
const CNAME={red:'אדום',green:'ירוק',blue:'כחול',orange:'כתום',olive:'זית',yellow:'צהוב',white:'לבן',grey:'אפור',black:'שחור'};
const ACC=['mcb','pb','pbl','pl22'];
const CISZ={K1:{w:80,h:131,n:'CI-K1 131×80'},K2:{w:100,h:181,n:'CI-K2 181×100'},K3:{w:120,h:222,n:'CI-K3 222×120'},K4:{w:160,h:240,n:'CI-K4 240×160'},K5:{w:200,h:280,n:'CI-K5 280×200'},C1:{w:187.5,h:250,n:'Ci 250×187.5'},C2:{w:250,h:375,n:'Ci 375×250'},C3:{w:375,h:250,n:'Ci 250×375'},C4:{w:375,h:375,n:'Ci 375×375'}};
const WCOL={brown:{base:'#8b5a2b',n:'חום'},black:{base:'#1d1d1d',n:'שחור'},grey:{base:'#8f8f8f',n:'אפור'},blue:{base:'#2563eb',n:'כחול'},yg:{base:'#f2c94c',dash:'#16a34a',n:'צהוב-ירוק'},red:{base:'#dc2626',n:'אדום'},white:{base:'#f1f1f1',n:'לבן'},orange:{base:'#f97316',n:'כתום'}};

/* ================= single-line diagram symbols =================
   IEC-style line symbols for the "חד קווי" tab: black on the white sheet, the
   way they're printed. Most stand 60 tall with a terminal at the top and one at
   the bottom (the grid is 10), so a feeder is a straight drop from the busbar.
   Each shows its designation, rating and description beside it. */
const SK='#111';
const sL=(x1,y1,x2,y2,w=2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${SK}" stroke-width="${w}" stroke-linecap="round"/>`;
const sC=(x,y,r,fill='#fff',w=2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${SK}" stroke-width="${w}"/>`;
const sR=(x,y,w,h,fill='#fff',sw=2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${SK}" stroke-width="${sw}"/>`;
const sT=(x,y,s,size=9,w=700,anchor='middle')=>txt(x,y,s,size,SK,w,anchor);
const IO=()=>[[0,-30,''],[0,30,'']],TOP=()=>[[0,-30,'']];
function sLbl(o,w){const ls=[[o.p.tag,9,700],[o.p.rating,7.5,400],[o.p.desc,7.5,400]].filter(l=>l[0]);const x=w/2+5;return ls.map((l,i)=>txt(x,-10+i*10.5,l[0],l[1],SK,l[2],'start')).join('');}
// A switching contact: the fixed contact's mark tells breaker / isolator / contactor / switch.
function sSwitch(mark){let s=sL(0,-30,0,-12)+sL(0,12,0,30)+sL(0,12,-11,-13);
 if(mark==='x')s+=sL(-4,-16,4,-8)+sL(-4,-8,4,-16);

 if(mark==='arc')s+=`<path d="M-5 -12a5 5 0 0 0 10 0" fill="none" stroke="${SK}" stroke-width="2"/>`;
 if(mark==='circ')s+=sC(0,-12,3);
 return s;}

/* ================= in the field: cables, trays, motors and pumps =================
   Drawn to scale like the rest of the panel (mm). */
// Core colours by IEC 60445: L1 brown, L2 black, L3 grey, N blue, PE green-yellow.
const CORESETS={'2':[['L','#8b5a2b'],['N','#2563eb']],'3':[['L','#8b5a2b'],['N','#2563eb'],['PE','pe']],'4':[['L1','#8b5a2b'],['L2','#1d1d1d'],['L3','#8f8f8f'],['PE','pe']],'5':[['L1','#8b5a2b'],['L2','#1d1d1d'],['L3','#8f8f8f'],['N','#2563eb'],['PE','pe']]};
const CSECS=['1.5','2.5','4','6','10','16','25','35','50','70','95','120','150','185','240'];
function cabG2(o){const C=CORESETS[o.p.cores]||CORESETS['5'],n=C.length,sec=+o.p.sec||2.5,D=Math.round(6+2.2*Math.sqrt(sec*n)),cw=Math.max(1.8,Math.sqrt(sec)*1.25),pitch=Math.max(cw+5,10),span=(n-1)*pitch;
 const len=Math.max(20,+o.p.len||200),brk=Math.max(30,+o.p.brk||120),w=Math.max(D,span+cw)+6,h=len+brk;return {C,n,sec,D,cw,pitch,span,len,brk,w,h};}
/* A cable runs along a route of points (its own, relative to it) and can be opened
   at either end: there its cores fan out, in the direction it arrives from, each
   ending in a terminal. Cables from before routes had a straight run with the
   cores opening at the top, which is what cabRoute() gives them. */
function cabRoute(o){if(o.p.route&&o.p.route.length>1)return o.p.route;const g=cabG2(o);return [{x:0,y:r2(g.h/2-g.len)},{x:0,y:r2(g.h/2)}];}
function cabEnds(o){const e=o.p.ends||'A';return {A:e==='A'||e==='AB',B:e==='B'||e==='AB'};}
function cabGeo(o){const g=cabG2(o),R=cabRoute(o),E=cabEnds(o),outs=[],terms=[];
 const fan=(P,Q,tag)=>{let dx=P.x-Q.x,dy=P.y-Q.y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const nx=-dy,ny=dx;
  const cores=g.C.map(([lb,c],i)=>{const o0=-g.D/2+g.D*(i+.5)/g.n,o1=-g.span/2+i*g.pitch,a={x:P.x+nx*o0,y:P.y+ny*o0},t={x:r2(P.x+dx*g.brk+nx*o1),y:r2(P.y+dy*g.brk+ny*o1)};
   return {lb,c,a,t,c1:{x:a.x+dx*g.brk*.5,y:a.y+dy*g.brk*.5},c2:{x:t.x-dx*g.brk*.45,y:t.y-dy*g.brk*.45},dx,dy,nx,ny};});
  outs.push({P,dx,dy,cores,tag});cores.forEach(c=>terms.push([c.t.x,c.t.y,c.lb]));};
 if(E.A)fan(R[0],R[1],'A');if(E.B)fan(R[R.length-1],R[R.length-2],'B');
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y,m)=>{x0=Math.min(x0,x-m);x1=Math.max(x1,x+m);y0=Math.min(y0,y-m);y1=Math.max(y1,y+m);};
 R.forEach(p=>add(p.x,p.y,g.D/2+2));outs.forEach(f=>f.cores.forEach(c=>add(c.t.x,c.t.y,6)));
 const w=2*Math.max(Math.abs(x0),Math.abs(x1)),h=2*Math.max(Math.abs(y0),Math.abs(y1));
 return {g,R,E,outs,terms,w,h,box:{x0,y0,x1,y1}};}
/* Moved so the drawing is centred on the cable's own point again (selection box,
   bounds and rotation all assume it is). */
function cabRecentre(o){const G=cabGeo(o),cx=(G.box.x0+G.box.x1)/2,cy=(G.box.y0+G.box.y1)/2;if(Math.abs(cx)<.01&&Math.abs(cy)<.01)return;
 const [wx,wy]=fromLocal(o,cx,cy);o.p.route=G.R.map(p=>({x:r2(p.x-cx),y:r2(p.y-cy)}));o.x=r2(wx);o.y=r2(wy);}
function cabLength(o){const G=cabGeo(o);let L=0;for(let i=1;i<G.R.length;i++)L+=Math.hypot(G.R[i].x-G.R[i-1].x,G.R[i].y-G.R[i-1].y);cabBends(o).forEach(b=>{if(!b)return;const t=Math.hypot(b.A.x-b.P.x,b.A.y-b.P.y),ang=2*Math.atan(t/b.r);L+=b.r*ang-2*t;});return L+G.g.brk*G.outs.length;}
/* Bends follow an arc of at least the cable's bending radius (a multiple of its
   diameter, 6× by default as for PVC cables); where the runs either side are too
   short for it the arc is as wide as they allow, and that bend is flagged. */
function cabBends(o){const G=cabGeo(o),R=G.R,need=(+o.p.rad||6)*G.g.D,out=[];
 for(let i=1;i<R.length-1;i++){const a=R[i-1],P=R[i],b=R[i+1];let ux=P.x-a.x,uy=P.y-a.y,vx=b.x-P.x,vy=b.y-P.y;const lu=Math.hypot(ux,uy),lv=Math.hypot(vx,vy);if(lu<.01||lv<.01){out.push(null);continue;}
  ux/=lu;uy/=lu;vx/=lv;vy/=lv;const cr=ux*vy-uy*vx,dot=ux*vx+uy*vy,phi=Math.atan2(Math.abs(cr),dot);if(phi<.01){out.push(null);continue;}
  const tn=Math.tan(phi/2),tMax=Math.min(lu,lv)/2,t=Math.min(need*tn,tMax),r=t/tn;out.push({P,A:{x:P.x-ux*t,y:P.y-uy*t},B:{x:P.x+vx*t,y:P.y+vy*t},r,sweep:cr>0?1:0,tight:r<need-.5,need});}
 return out;}
function cabPathD(o){const R=cabGeo(o).R,B=cabBends(o);let d=`M${R[0].x} ${R[0].y}`;for(let i=1;i<R.length-1;i++){const b=B[i-1];if(!b){d+=`L${R[i].x} ${R[i].y}`;continue;}d+=`L${r2(b.A.x)} ${r2(b.A.y)}A${r2(b.r)} ${r2(b.r)} 0 0 ${b.sweep} ${r2(b.B.x)} ${r2(b.B.y)}`;}return d+`L${R[R.length-1].x} ${R[R.length-1].y}`;}
function cabSVG(o){const G=cabGeo(o),g=G.g,R=G.R,sh=CSHEATH[o.p.color]||COLORS[o.p.color]||CSHEATH.green,d=cabPathD(o);
 let s=`<path d="${d}" fill="none" stroke="#111" stroke-width="${g.D+1.6}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${sh}" stroke-width="${g.D}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="${g.D*.16}" stroke-linejoin="round"/>`;
 G.outs.forEach(f=>{f.cores.forEach(c=>{const pd=`M${c.a.x} ${c.a.y}C${c.c1.x} ${c.c1.y} ${c.c2.x} ${c.c2.y} ${c.t.x} ${c.t.y}`;
   if(c.c==='pe')s+=`<path d="${pd}" fill="none" stroke="#f2c94c" stroke-width="${g.cw}" stroke-linecap="round"/><path d="${pd}" fill="none" stroke="#16a34a" stroke-width="${g.cw}" stroke-dasharray="${g.cw*1.6} ${g.cw*1.6}"/>`;
   else s+=`<path d="${pd}" fill="none" stroke="#000" stroke-width="${g.cw+.8}" stroke-linecap="round" opacity=".55"/><path d="${pd}" fill="none" stroke="${c.c}" stroke-width="${g.cw}" stroke-linecap="round"/>`;
   s+=`<path d="M${c.t.x-c.dx*5} ${c.t.y-c.dy*5}L${c.t.x} ${c.t.y}" stroke="#c8892d" stroke-width="${g.cw*.9}"/>`+txt(c.t.x-c.dx*10+c.nx*(g.cw/2+2.5),c.t.y-c.dy*10+c.ny*(g.cw/2+2.5),c.lb,3.2,'#ddd',700);});
  s+=`<path d="M${f.P.x-f.dx*3} ${f.P.y-f.dy*3}L${f.P.x+f.dx*2} ${f.P.y+f.dy*2}" stroke="#1f1f1f" stroke-width="${g.D+3}"/>`;});
 let bi=0,bl=0;for(let i=1;i<R.length;i++){const l=Math.hypot(R[i].x-R[i-1].x,R[i].y-R[i-1].y);if(l>bl){bl=l;bi=i;}}
 if(bl>40){const a=R[bi-1],b=R[bi],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;if(ang>90)ang-=180;if(ang<=-90)ang+=180;
  const lbl=[o.p.tag,`${g.n}×${o.p.sec}`].filter(Boolean).join(' · ');s+=`<text x="${mx}" y="${my}" font-size="${Math.min(9,g.D*.45)}" fill="#fff" font-family="Arial" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang} ${mx} ${my})">${esc(lbl)}</text>`;}

/* ================= example projects =================
   Ready boards to start from — each a panel front laid out to scale and its
   single-line diagram, with the same designations in both, so it can be changed
   rather than drawn from nothing. Built here from the same parts as the library. */
function tplKit(){const o=[];
 const add=(t,p,x,y,n,rot=0)=>{const e=mkObj({t,n:n||t,p:p||{}});e.x=r2(x);e.y=r2(y);e.rot=rot;o.push(e);return e;};
 // parts side by side along a DIN rail, from its left end, with end stops
 const rail=(x,y,len,items)=>{const r=add('rail',{len},x,y,'פס DIN 35');let u=x-len/2+6;const put=(t,p,n)=>{const e=mkObj({t,n:n||t,p:p||{}});const w=sizeOf(e).w;e.x=r2(u+w/2);e.y=y;u+=w;o.push(e);return e;};
  put('endstop',{},'מעצור קצה');const x0=u;items.forEach(i=>put(i[0],i[1],i[2]));const x1=u;put('endstop',{},'מעצור קצה');r.run=[x0,x1];return r;};
 const duct=(x,y,len,dw=60,rot=0)=>add('duct',{len,dw},x,y,'תעלת חיווט',rot);
 const label=(x,y,text,fs=30)=>add('label',{text,fs,color:'black'},x,y,'תיבת טקסט');
 const cable=(route,p,ends='A')=>{const c=mkObj({t:'cable',n:'כבל',p:Object.assign({cores:'5',sec:'16',color:'green',ends},p)});c.x=0;c.y=0;c.p.route=route.map(q=>({x:r2(q.x),y:r2(q.y)}));o.push(c);cabRecentre(c);return c;};
 const onFloor=(m,fy)=>{m.y=r2(fy-sizeOf(m).h/2);return m;};
 const termTop=m=>{const t=termsOf(m)[0],[x,y]=fromLocal(m,t[0],t[1]);return {x,y};};
 const tag=(e,x,y,text,fs=11)=>{const l=label(x,y,text,fs);l.p.of=e.id;return l;};
 return {o,add,rail,duct,label,cable,onFloor,termTop,tag};}
/* The diagram: a source chain from the top down to a busbar, then feeders hanging
   from it, each a column of symbols wired top to bottom. */
function sldKit(){const o=[],ws=[];
 const add=(t,p,x,y)=>{const e=mkObj({t,n:(LIB.flatMap(T=>T.groups.flatMap(g=>g.items)).find(i=>i.t===t)||{n:t}).n,p:p||{}});e.x=x;e.y=y;o.push(e);return e;};
 const top=e=>(e.type==='sgrid'||e.type==='sgen')?null:0,bot=e=>(e.type==='sgrid'||e.type==='sgen')?0:(termsOf(e).length>1?(e.type==='sats'?2:1):null);
 const wire=(a,ta,b,tb)=>{if(ta==null||tb==null)return;ws.push({id:uid(),type:'wire',p:{color:'black',sec:'1.5',name:'חוט',auto:1},pts:[{r:a.id,t:ta},{r:b.id,t:tb}]});};
 const chain=(list,x,y0,step=100)=>{let prev=null;return list.map(([t,p],i)=>{const e=add(t,p,x,y0+i*step);if(prev)wire(prev,bot(prev),e,top(e));prev=e;return e;});};
 const bus=(x,y,len,p)=>add('sbus',Object.assign({tag:'',rating:'3×400/230V 50Hz',len},p||{}),x,y);
 const bt=(b,x)=>{let bi=0,bd=1e9;termsOf(b).forEach((t,i)=>{const d=Math.abs(b.x+t[0]-x);if(d<bd){bd=d;bi=i;}});return bi;};
 const feeders=(b,cols,x0,step=110)=>cols.forEach((col,i)=>{const x=x0+i*step,c=chain(col,x,70);wire(b,bt(b,x),c[0],top(c[0]));});
 const intoBus=(e,b)=>wire(e,bot(e),b,bt(b,e.x));
 return {o,ws,add,wire,chain,bus,bt,feeders,intoBus,top,bot,all:()=>[...o,...ws]};}

  let k=o.p.name+(o.p.rating&&!['label'].includes(o.type)?' '+o.p.rating:'');if(o.type==='cable'||o.type==='traysh'||o.type==='traymesh'){const g=o.type==='cable'?cabG2(o):null;k=o.type==='cable'?`כבל ${CNAME[o.p.color]||''} ${g.n}×${o.p.sec} ממ"ר`:`${o.type==='traysh'?'תעלת פח':'תעלת רשת'} ${o.p.tw} מ"מ`;rows[k]=rows[k]||{n:0,len:0};rows[k].len+=o.type==='cable'?cabLength(o):o.p.len;rows[k].n++;return;}
  if(o.type==='rail'||o.type==='duct'||o.type==='busbar'||o.type==='partition'){k=o.p.name+(o.type==='duct'?` ${o.p.dw}מ"מ`:'');rows[k]=rows[k]||{n:0,len:0};rows[k].len+=o.p.len;rows[k].n++;return;}
  if(o.type==='cabinet'){const g=cabG(o),FN={door:'דלת',double:'דלת כפולה',cover:'פאנלים מוברגים',none:'ללא חזית'};g.S.forEach(sc=>{const kk=`שדה ארון ${sc.w}×${g.H} — ${FN[sc.f]}`;rows[kk]=rows[kk]||{n:0};rows[kk].n++;});if(g.P){const kk=`סוקל ${g.P} מ"מ`;rows[kk]=rows[kk]||{n:0,len:0};rows[kk].len+=g.W;rows[kk].n++;}return;}
  if(o.type==='label')return;if(o.type==='enclosure')k=`לוח ${o.p.w}×${o.p.h} `+({key:'עם דלת ומנעול',handle:'עם ידית ומנעול'}[o.p.door]||'ללא דלת');if(o.type==='cibox')k='קופסה '+CISZ[o.p.size].n+(o.p.window==='1'?' עם חלון':'');if(DEF[o.type].front&&DEF[o.type].edit.includes('color'))k=o.p.name+' '+CNAME[o.p.color];rows[k]=rows[k]||{n:0};rows[k].n++;});
 const ks=Object.keys(rows);const line=k=>{const r=rows[k];return r.len!==undefined?`${(r.len/1000).toFixed(2)} מ'`+(r.n?` (${r.n} יח')`:''):`${r.n} יח'`;};
 return ks.map(k=>[k,line(k)]);}
function bom(){const d=bomData(),ks=d.map(r=>r[0]),L=Object.fromEntries(d),line=k=>L[k];
 const txtOut=`רשימת ציוד — ${state.name}\n`+ks.map(k=>`${k}\t${line(k)}`).join('\n');
 modal('רשימת ציוד',ks.length?`<table><tr><th>פריט</th><th>כמות</th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td style="white-space:nowrap">${line(k)}</td></tr>`).join('')}</table><div class="hint" style="margin-top:10px">אורכי חוטים משורטטים לפי קנה מידה 1:1 (מ"מ) ואינם כוללים עודפים.</div>`:'<div class="hint">הלוח ריק.</div>',
  [{t:'העתק כטקסט',cls:'pri',fn:()=>{copyText(txtOut);return false;}},{t:'סגור'}]);}
function copyText(s){const ok=()=>toast('הועתק');try{navigator.clipboard.writeText(s).then(ok,()=>fallbackCopy(s));}catch(e){fallbackCopy(s);}}
function fallbackCopy(s){modal('העתקה',`<div class="hint">סמן והעתק ידנית:</div><textarea id="f_cp" rows="10" style="direction:ltr">${esc(s)}</textarea>`);setTimeout(()=>{const t=$('f_cp');t.focus();t.select();},50);}
function copyJSON(){copyText(JSON.stringify(state));}
function importJSON(){modal('ייבוא פרויקט',`<label class="wbtn pri" style="display:block;text-align:center;cursor:pointer;margin-bottom:10px">📂 בחר קובץ פרויקט (.json)<input id="f_imF" type="file" accept=".json,application/json" style="display:none"></label><div class="hint">או הדבק כאן את התוכן:</div><textarea id="f_im" rows="6" style="direction:ltr"></textarea>`,[{t:'ייבא',cls:'pri',fn:()=>{try{const s=JSON.parse($('f_im').value);if(!Array.isArray(s.objs))throw 0;s.objs=s.objs.filter(o=>o.type==='wire'||DEF[o.type]);setCloud(null);state={name:s.name||'מיובא',objs:s.objs};sel=null;hist=[];hi=-1;commit();renderNow();fit();toast('יובא בהצלחה');}catch(e){toast('התוכן אינו קובץ פרויקט תקין');return false;}}},{t:'ביטול'}]);$('f_imF').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{$('f_im').value=rd.result;toast('הקובץ נטען — לחץ ייבא');};rd.readAsText(fl);};}

async function saveFile(fname,data){try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){try{await d.save({filename:fname,data});toast('נשמר: '+fname);}catch(e){if(e&&e.code==='declined')return;toast('השמירה נכשלה'+(e&&e.code?' ('+e.code+')':''));}return;}}}catch(e){}
 try{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}catch(e){toast('ההורדה חסומה כאן');}}
function dataUrlToBlob(u){const [h,b]=u.split(','),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.split(':')[1].split(';')[0]});}
function safeName(n){return String(n||'panel').replace(/[\\/:*?"<>|]+/g,'_');}

  s+=`<path d="M${B.x0} ${yd}l${ar*1.5} ${-ar/2}v${ar}zM${B.x1} ${yd}l${-ar*1.5} ${-ar/2}v${ar}zM${xd} ${B.y0}l${-ar/2} ${ar*1.5}h${ar}zM${xd} ${B.y1}l${-ar/2} ${-ar*1.5}h${ar}z" fill="#000"/>`;
  s+=T((B.x0+B.x1)/2,yd-ar,w)+T(xd-ar,(B.y0+B.y1)/2,h,1);});return s;}
function svgToJpeg(svgStr,W,H,dpi){return new Promise((res,rej)=>{const px=dpi/25.4,img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(W*px);c.height=Math.round(H*px);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.92));}catch(e){rej(e);}};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);});}
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}
async function makePdf(t){toast('יוצר PDF…');const LY=layoutRect();if(LY){t.paper=LY.L.paper;t.orient=LY.L.orient;}let [W,H]=PAPER[t.paper]||PAPER.A3;if(t.orient==='P')[W,H]=[H,W];
 const bd=bomData(),pages=t.bomPage==='1'&&bd.length?2:1;const svgs=[];
 // page 1: drawing
 {const tb=tbSVG(t,W,H,1,pages,'');const ax0=30,ay0=20,ax1=W-20,ay1=tb.y0-6,aw=ax1-ax0-28,ah=ay1-ay0-28;const b=boundsAll(),pad=4,bw=b.w+2*pad,bh=b.h+2*pad;
  const need=Math.max(bw/aw,bh/ah);const STD=[1,2,2.5,5,10,15,20,25,50,75,100,200];let n=LY?LY.n:(STD.find(v=>v>=need)||Math.ceil(need));const k=1/n;
  const scaleLbl=n===1?'1:1':`1:${n}`;const tb2=tbSVG(t,W,H,1,pages,scaleLbl);
  const ox=ax0+(aw-bw*k)/2,oy=ay0+20+(ah-bh*k)/2;
  svgs.push(`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm">${pageFrame(W,H)}<g transform="${LY?`translate(${-LY.x0*k} ${-LY.y0*k}) scale(${k})`:`translate(${ox} ${oy}) scale(${k}) translate(${-(b.x-pad)} ${-(b.y-pad)})`}">${content({sel:false})}${pdfDims(k)}</g>${scaleBar(32,tb2.y0-9,k,n)}${tb2.s}<text x="22" y="${H-5}" font-size="2.2" font-family="Arial" fill="#777">OhadCad</text></svg>`);
  t.__scale=scaleLbl;}
 if(pages===2){const tb=tbSVG(Object.assign({},t,{title:t.title+' — רשימת ציוד'}),W,H,2,2,'-');let s='';const R=W-20,x0=30,rh=7;let y=26;
  s+=`<text x="${R}" y="${y}" font-size="6" font-weight="700" font-family="Arial" text-anchor="start" direction="rtl">רשימת ציוד</text>`;y+=6;
  const colQ=x0+45,colN=R-14;s+=`<rect x="${x0}" y="${y}" width="${R-x0}" height="${rh}" fill="#e5e7eb" stroke="#000" stroke-width=".3"/>`;
  const T=(x,yy,str,sz,w=400,anc='end')=>`<text x="${x}" y="${yy}" font-size="${sz}" font-family="Arial" font-weight="${w}" ${anc==='end'?'text-anchor="start" direction="rtl"':`text-anchor="${anc}"`}>${esc(str)}</text>`;
  s+=T(R-2,y+4.8,'מס׳',3.2,700)+T(colN-2,y+4.8,'פריט',3.2,700)+T(colQ-2,y+4.8,'כמות',3.2,700);y+=rh;
  const maxY=tb.y0-6;bd.forEach(([k,q],i)=>{if(y+rh>maxY)return;s+=`<rect x="${x0}" y="${y}" width="${R-x0}" height="${rh}" fill="${i%2?'#f8f8f8':'#fff'}" stroke="#000" stroke-width=".2"/>`+T(R-2,y+4.8,String(i+1),3)+T(colN-2,y+4.8,k,3)+T(colQ-2,y+4.8,q,3);y+=rh;});
  s+=`<line x1="${colN}" y1="${32}" x2="${colN}" y2="${y}" stroke="#000" stroke-width=".2"/><line x1="${colQ}" y1="${32}" x2="${colQ}" y2="${y}" stroke="#000" stroke-width=".2"/>`;
  svgs.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm">${pageFrame(W,H)}${s}${tb.s}</svg>`);}
 try{const dpi=W>500?130:170;const imgs=[];for(const sv of svgs)imgs.push(await svgToJpeg(sv,W,H,dpi));
  let pdfBlob=null,pdf=null;try{await loadJsPDF();const {jsPDF}=window.jspdf;pdf=new jsPDF({orientation:W>H?'landscape':'portrait',unit:'mm',format:[W,H]});imgs.forEach((im,i)=>{if(i)pdf.addPage([W,H],W>H?'landscape':'portrait');pdf.addImage(im,'JPEG',0,0,W,H);});pdfBlob=pdf.output('blob');}catch(e){}
  const fname=((t.dwgno?t.dwgno+'_':'')+(t.title||'panel')).replace(/[\\/:*?"<>|]+/g,'_')+'.pdf';
  modal('PDF מוכן',`${imgs.map(im=>`<img src="${im}" style="width:100%;border-radius:6px;margin-bottom:8px;background:#fff">`).join('')}<div class="hint">${pdfBlob?`קובץ: ${esc(fname)} · ${t.paper} · קנה מידה ${t.__scale}.`:'לא ניתן היה לטעון את מחולל ה-PDF — אפשר לשמור את התמונות בלחיצה ארוכה.'}</div>`,
   [...(pdfBlob?[{t:'⬇ הורד PDF',cls:'pri',fn:()=>{saveFile(fname,pdfBlob);return false;}}]:[]),{t:'סגור'}]);}
 catch(e){toast('יצירת ה-PDF נכשלה');}}
function exportImage(){if(!state.objs.length){toast('הלוח ריק');return;}const b=boundsAll(),pad=12;const x=b.x-pad,y=b.y-pad,w=b.w+2*pad,h=b.h+2*pad;const k=Math.min(5,4200/Math.max(w,h));
 const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${Math.round(w*k)}" height="${Math.round(h*k)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${content({sel:false})}</svg>`;
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);let url;try{url=c.toDataURL('image/png');}catch(e){url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}
  modal('תמונת הלוח',`<img src="${url}" style="width:100%;border-radius:8px;background:#fff">`,[{t:'⬇ הורד PNG',cls:'pri',fn:()=>{saveFile(safeName(state.name)+'.png',dataUrlToBlob(url));return false;}},{t:'סגור'}]);};
 img.onerror=()=>toast('יצירת התמונה נכשלה');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}
function help(){modal('איך עובדים',`<div style="line-height:1.7;font-size:15px">
<b>סרגל הכלים (בצד):</b> "הוסף" פותח את ספריית הרכיבים עם חיפוש. "חיווט" מפעיל מצב חיווט. "מאפיינים" פותח פאנל עריכה של הרכיב הנבחר — שינויים נשמרים מיד. מתחת: שכפול, סיבוב, נעילה, מחיקה, "הכל" (התאמת תצוגה) ו"גריד".<br>
<b>הוספה:</b> רכיב נכנס אוטומטית למקום הפנוי הבא על פס DIN (או אחרי הרכיב שבחרת).<br>
<b>הזזה:</b> גרור רכיב; ליד פס DIN הוא נצמד. גרירת פס מזיזה את הרכיבים שעליו. ארון/לוח — בחר אותו קודם ואז גרור.<br>
<b>תצוגה:</b> גרירה על רקע ריק מזיזה, צביטה מגדילה/מקטינה.<br>
<b>חיווט:</b> הקש על מהדק, נקודות פינה, ומהדק יעד.<br>
<b>צבע:</b> בחר צבע לפני הוספת מפסק, או בחר רכיב ואז הקש על צבע.<br>
<b>שמירה:</b> נשמר אוטומטית בדפדפן. "שמור בשם" ליצירת כמה לוחות. לגיבוי — "העתק קובץ פרויקט".</div>`);}
