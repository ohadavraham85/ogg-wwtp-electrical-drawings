<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OhadCad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--toph:64px;--toph2:50px;--bg:#0b0b0c;--card:#141416;--card2:#232326;--line:#3d3d42;--line-acc:rgba(255,140,0,.65);--txt:#ffffff;--mut:#cfcfd4;--acc:#ff8c00;--acc-light:#ffb340;--ink:#000;--fab:#000;--grid:#18181a;--on-acc:#000;--ctl:linear-gradient(180deg,#2c2c30,#17171a);--ctl-bd:#4a4a50}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#stage{position:fixed;inset:0;background-color:#0b0b0c;touch-action:none}
#svg{width:100%;height:100%;display:block;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none}
.card{background:var(--card);border:1px solid var(--line-acc);border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;height:var(--toph);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:6}
#selInfo{display:flex;align-items:center;gap:10px;min-width:70px;flex:1 1 70px}
#selThumb{width:38px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
#selThumb svg{max-width:100%;max-height:100%}
#selName{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:4px;direction:ltr;flex:none}
.tb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.tb:disabled{opacity:.28}
.tb.on{background:var(--acc)}
.tb svg,.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;width:56px;height:56px;border-radius:4px;background:var(--fab);display:flex;align-items:center;justify-content:center;z-index:4;border:1px solid var(--line)}
.fab.on{background:#7c2d12}
.col{position:fixed;display:flex;flex-direction:column;gap:10px;z-index:4}
.col .fab{position:static}
#dock{position:absolute;bottom:100%;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-bottom:8px;pointer-events:none}
.pill{pointer-events:auto;display:flex;background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.pb{width:48px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:4px}
.pb:active{background:var(--card2)}.pb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pb span{font-size:10.5px;color:#cfcfcf;line-height:1}.pb b{font-size:13px;height:22px;display:flex;align-items:center}
.pb.dng svg{stroke:#f87171}.pb.on{background:#7c2d12}
#rail{display:flex;flex-direction:row;align-items:center;gap:2px;flex:0 1 auto;min-width:0;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;direction:rtl}
#rail::-webkit-scrollbar{display:none}
@media (max-width:1000px) and (min-height:501px){:root{--toph:118px}
 #top{flex-wrap:wrap;align-content:center;row-gap:0;padding:2px 6px}
 #top>.sep{display:none}
 #bMenu{order:1}#selInfo{order:2}#top>.tbtns{order:3}
 #rail{order:4;flex:1 0 100%;height:58px;justify-content:space-between;border-top:1px solid var(--line)}
 #rail .rb{width:auto;min-width:40px;flex:1 0 auto;height:54px;padding:0 1px}
 #rail .rb span{font-size:10px}#rail .rb svg{width:22px;height:22px}
 #rail .sep{margin:0 1px;height:30px}
 #rail.more{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 44px);mask-image:linear-gradient(to right,transparent 0,#000 44px)}}
.rb{width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:4px;flex:none}
.rb:active{background:var(--card2)}.rb svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb span{font-size:11px;color:#d4d4d4;line-height:1}.rb b{font-size:15px;height:25px;display:flex;align-items:center}
.rb.on{background:var(--acc)}.rb.on span{color:#fff}.rb:disabled{opacity:.28}.rb.dng svg{stroke:#f87171}
.sep{width:1px;height:34px;background:var(--line);margin:0 4px;flex:none}
#panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + var(--toph) + var(--toph2) + 18px);bottom:10px;width:min(360px,calc(100vw - 20px));background:var(--card);border:1px solid var(--line-acc);border-radius:4px;z-index:7;display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.65);transition:transform .2s,opacity .2s}
#panel.hidden{transform:translateX(24px);opacity:0;pointer-events:none}
#libStrip{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--card);border:1px solid var(--line-acc);border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.5);cursor:pointer}
#libStrip.on{display:none}
#libStrip svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#libStrip span{writing-mode:vertical-rl;font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;flex:none}.phead b{font-size:18px}
#pClose{width:40px;height:40px;border-radius:4px;background:var(--card2);font-size:17px}
#libWrap{display:flex;flex-direction:column;min-height:0;flex:1}
#search{margin:0 12px 8px;width:auto;flex:none}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 6px;overflow:visible;flex:none}
#tabs .tab{padding:8px 12px;font-size:14px;border-radius:4px}
#sheetBody{overflow-y:auto;padding:0 12px 16px;flex:1}
#sheetBody .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
#sheetBody .item{min-height:108px;border-radius:4px}
#sheetBody .chip{width:44px;height:32px}
#propsBody{overflow-y:auto;padding:4px 14px 18px;flex:1}
#wireBar{position:fixed;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line-acc);border-radius:4px;padding:10px;z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#wireBar.hidden{display:none}
#wireBar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#wireBar .row+.row{margin-top:8px}
#wireBar .wc{width:30px;height:30px;border-radius:50%;border:3px solid #555}#wireBar .wc.on{border-color:#fff}
#wireBar select{width:auto;padding:7px}#wireBar .wbtn{padding:8px 11px;font-size:14px}
#panel.half{top:52vh}
#selInfo{cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;height:42vh;background:var(--card);border-radius:4px 4px 0 0;z-index:6;display:flex;flex-direction:column;transition:transform .25s;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(0,0,0,.45)}
#sheet.col2{transform:translateY(calc(100% - 100px))}
.tab.wire{display:flex;align-items:center;gap:6px}.tab.wire svg{width:20px;height:20px}
#handle{height:34px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;touch-action:none;cursor:ns-resize}
#bSheet{position:absolute;left:10px;top:2px;height:30px;padding:0 12px;border-radius:4px;background:var(--card2);font-size:13px;display:flex;align-items:center;gap:4px}
#handle span{width:48px;height:5px;border-radius:3px;background:#777}
#tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 10px;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card2);border-radius:4px;padding:11px 20px;font-size:16px;white-space:nowrap}
.tab.on{background:var(--acc)}
#sheetBody{overflow-y:auto;padding:0 12px 20px;flex:1}
.grp{font-size:18px;margin:10px 4px 10px}
.chips{display:flex;gap:10px;margin:0 2px 12px;flex-wrap:wrap}
.chip{width:58px;height:36px;border-radius:4px;border:3px solid var(--line)}
.chip.on{border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item{background:var(--card2);border-radius:4px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
.item:active{background:#3b4049}
.item .th{height:72px;width:100%;display:flex;align-items:center;justify-content:center}
.item .th svg{max-height:72px;max-width:92%}
.item .nm{font-size:13.5px;text-align:center;line-height:1.2;direction:ltr}
.item .nm.he{direction:rtl}
#wirePanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wbtn{background:var(--card2);border-radius:4px;padding:11px 14px;font-size:15px}
.wbtn.pri{background:var(--acc)}
.wbtn.on{background:#166534}
.hint{color:var(--mut);font-size:14px;line-height:1.5;margin:4px 2px 12px}
select,input,textarea{font:inherit;background:var(--ink);color:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hidden,#drawer.hidden{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:4px;width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column}
.mbox h3{margin:0;padding:16px 18px 6px;font-size:19px}
.mbody{padding:8px 18px;overflow:auto;flex:1}
.mbtns{display:flex;gap:10px;padding:12px 18px 16px;flex-wrap:wrap}
.mbtns button{flex:1;background:var(--card2);border-radius:4px;padding:12px;font-size:16px;min-width:90px}
.mbtns button.pri{background:var(--acc)}
.mbtns button.dng{background:#991b1b}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:right}
#drawer{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5)}
#drawer .dbox{position:absolute;top:0;bottom:0;right:0;width:280px;max-width:84vw;background:var(--card);padding:calc(env(safe-area-inset-top) + 18px) 12px 18px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#drawer .dbox h2{font-size:18px;margin:0 8px 12px}
#drawer .dbox button{text-align:right;padding:11px 12px;border-radius:4px;font-size:16px}
#drawer .dbox button:active{background:var(--card2)}
.plist button{display:block;width:100%;text-align:right;background:var(--card2);border-radius:4px;padding:12px;margin-bottom:8px}
#rulX{position:fixed;left:20px;right:0;bottom:0;height:20px;background:var(--card);border-top:1px solid var(--line-acc);z-index:3;overflow:hidden;pointer-events:none;direction:ltr}
#rulY{position:fixed;left:0;top:0;bottom:20px;width:20px;background:var(--card);border-right:1px solid var(--line-acc);z-index:3;overflow:hidden;pointer-events:none;direction:ltr}
#rulX i,#rulY i{position:absolute;background:var(--mut);display:block}#rulX b,#rulY b{position:absolute;font:600 10px "JetBrains Mono",Arial;color:#d8dde3;white-space:nowrap}
#rulX .cur,#rulY .cur{background:var(--acc)}
#coord{position:fixed;left:28px;bottom:28px;z-index:3;background:var(--card);border:1px solid var(--line-acc);border-radius:4px;padding:4px 9px;font:600 12px "JetBrains Mono",Arial;color:var(--acc-light);direction:ltr;pointer-events:none}
body.noaxes #rulX,body.noaxes #rulY,body.noaxes #coord{display:none}
#docTabs{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + var(--toph) + 10px);height:var(--toph2);z-index:5;display:flex;align-items:center;background:var(--card);border:1px solid var(--line-acc);border-radius:4px;padding:3px 8px;gap:2px;box-shadow:0 3px 12px rgba(0,0,0,.5);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#docTabs::-webkit-scrollbar{display:none}
#docTabs button{flex:none;padding:8px 12px;border-radius:4px;font-size:14px;color:#cfcfcf;white-space:nowrap}#docTabs button.on{background:var(--acc);color:#fff}#docTabs #bDark,#docTabs #bLayout{padding:8px 9px}#docTabs #bLayout.on{background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--acc)}#saveSt{align-self:center;padding:0 8px;font-size:12.5px;color:#9ca3af;white-space:nowrap;flex:none}#saveSt[data-k=saved]{color:#4ade80}#saveSt[data-k=error]{color:#f87171}#docTabs #bDark.on{background:var(--card2)}
#docTabs .sep{height:28px}
body.sld #stage{background-color:#efefeb}
.item .th.lt{background:#f7f7f3;border-radius:4px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + var(--toph) + var(--toph2) + 18px);transform:translateX(-50%);background:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:4px;z-index:30;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
/* ---- component library layout ---- */
#libBody{display:flex;flex-direction:column;min-height:0;flex:1}
#tabs{flex-wrap:nowrap!important;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 12px 8px}
#tabs .tab{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13.5px;border-radius:4px;background:var(--card2);white-space:nowrap;flex:none}
#tabs .tab .ti{font-size:14px;opacity:.9;width:16px;text-align:center}#tabs .tab.on{background:var(--acc)}
#sheetBody .grp{position:sticky;top:0;z-index:1;background:var(--bg);font-size:14.5px;font-weight:700;color:#e5e5e5;margin:0 -2px 8px;padding:10px 4px 6px;border-bottom:1px solid var(--line)}
#sheetBody .hint{font-size:12.5px;line-height:1.5;background:var(--card);border-radius:4px;padding:8px 10px;margin:2px 0 6px}
#sheetBody .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:6px}
#sheetBody .item{min-height:100px;padding:8px 4px 6px}#sheetBody .item .th{height:60px}#sheetBody .item .th svg{max-height:60px}
#sheetBody .item .nm{font-size:12.5px;line-height:1.25}
@media (min-width:900px){
 #panel.lib{width:min(620px,calc(100vw - 20px))}
 #libBody{flex-direction:row}
 #tabs{flex-direction:column;overflow-x:hidden;overflow-y:auto;width:150px;flex:none;padding:0 10px 12px 8px;border-left:1px solid var(--line)}
 #tabs .tab{border-radius:4px;padding:10px 10px;white-space:normal;text-align:right;line-height:1.25;background:transparent}
 #tabs .tab:hover{background:var(--card2)}#tabs .tab.on{background:var(--acc)}
 #sheetBody{padding:0 12px 16px 12px}}
/* ---- high-contrast orange/black theme: raised, outlined controls ---- */
.card,#panel,#libStrip,#wireBar,#docTabs,.mbox,#coord{border:1.5px solid var(--acc)}
#panel,#docTabs,#wireBar,.mbox{box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.8)}
.tb:not(:disabled),.rb:not(:disabled),.pb,.fab,.tab,.wbtn,.mbtns button,#pClose,#bSheet,#docTabs button,#tabs .tab,.plist button{background:var(--ctl);border:1px solid var(--ctl-bd);border-bottom:2px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.6);color:var(--txt);transition:background .12s,border-color .12s,transform .06s}
.tb:disabled,.rb:disabled{border:1px solid transparent}
.pill{border:1.5px solid var(--acc);gap:3px}
#drawer .dbox{border-left:2px solid var(--acc)}
#drawer .dbox button{border:1px solid transparent}
@media (hover:hover){.tb:not(:disabled):hover,.rb:not(:disabled):hover,.pb:hover,.fab:hover,.tab:hover,.wbtn:hover,.mbtns button:hover,#pClose:hover,#bSheet:hover,#docTabs button:hover,#tabs .tab:hover,.plist button:hover,#drawer .dbox button:hover{border-color:var(--acc);background:#2a1a08}}
.tb:not(:disabled):active,.rb:not(:disabled):active,.pb:active,.fab:active,.tab:active,.wbtn:active,.mbtns button:active,#docTabs button:active,.plist button:active{transform:translateY(1px);border-bottom-width:1px;background:#3a2408}
.tb.on,.rb.on,.pb.on,.fab.on,.tab.on,#tabs .tab.on,.wbtn.pri,.mbtns button.pri,#docTabs button.on,#docTabs #bDark.on{background:linear-gradient(180deg,var(--acc-light),var(--acc));border-color:var(--acc-light);border-bottom-color:#a35a00;color:var(--on-acc);font-weight:700;box-shadow:0 0 0 1px #000,0 0 12px rgba(255,140,0,.45)}
.tb.on svg,.rb.on svg,.pb.on svg,.fab.on svg{stroke:var(--on-acc)}.rb.on span,.pb.on span{color:var(--on-acc);font-weight:700}
#docTabs #bLayout.on{background:var(--ctl);box-shadow:inset 0 0 0 2px var(--acc)}
.wbtn.on{background:#15803d;border-color:#22c55e;color:#fff}
.mbtns button.dng{background:linear-gradient(180deg,#dc2626,#991b1b);border-color:#ef4444;color:#fff}
.rb span,.pb span{color:#e8e8ec}#docTabs button{color:#fff}
.item{background:var(--card2);border:1px solid var(--ctl-bd)}
@media (hover:hover){.item:hover{border-color:var(--acc)}}
.item:active{background:#3a2408;border-color:var(--acc)}
.chip.on,#wireBar .wc.on{border-color:var(--acc);box-shadow:0 0 0 2px #000,0 0 10px rgba(255,140,0,.6)}
select,input,textarea{background:#000;border:1.5px solid var(--ctl-bd);color:#fff}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,140,0,.3)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sep{background:var(--acc);opacity:.55}
.phead{border-bottom:1px solid var(--acc)}.phead b{color:var(--acc-light)}
#sheetBody .grp{color:var(--acc-light);border-bottom-color:var(--acc)}
#toast{border:1.5px solid var(--acc)}
/* coordinates readout + rulers: black with strong orange */
#rulX,#rulY{background:#000}
#rulX{border-top:2px solid var(--acc)}#rulY{border-right:2px solid var(--acc)}
#rulX i,#rulY i{background:#fff}
#rulX b,#rulY b{color:#fff;font-weight:700}
#rulX .cur,#rulY .cur{background:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 8px 2px rgba(255,140,0,.8)}
#coord{background:#000;border:2px solid var(--acc);padding:6px 12px;font:700 14px "JetBrains Mono",Arial;color:var(--acc);letter-spacing:.3px;box-shadow:0 0 0 1px #000,0 0 14px rgba(255,140,0,.45),0 4px 12px rgba(0,0,0,.8);white-space:pre}
/* hamburger menu: solid orange, always stands out */
#bMenu{width:52px;height:52px;background:linear-gradient(180deg,var(--acc-light),var(--acc));border:1px solid var(--acc-light);border-bottom:3px solid #a35a00;box-shadow:0 0 0 1px #000,0 0 16px rgba(255,140,0,.55)}
#bMenu svg{stroke:#000;stroke-width:3;width:30px;height:30px}
@media (hover:hover){#bMenu:hover{background:linear-gradient(180deg,#ffc870,var(--acc-light));border-color:#fff}}
#bMenu:active{transform:translateY(1px);border-bottom-width:1px}
/* toolbar arrangement: chips per bar, and buttons shown in the other bar */
.tbz{margin:10px 0 4px}.tbzt{font-size:14px;font-weight:700;color:var(--acc-light);margin:0 2px 6px}
.tbzl{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;padding:8px;border:1.5px dashed var(--acc);border-radius:4px;background:#000}
.tbz.hz .tbzl{border-color:#6b6b72}
.tbc{display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:40px;border-radius:4px;background:var(--ctl);border:1px solid var(--ctl-bd);border-bottom:2px solid #000;font-size:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tbc svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tbc.sepc{color:var(--mut)}.tbc.sepc i{width:3px;height:22px;background:var(--acc);display:block}
.tbc.tbdrag{opacity:.35;border-style:dashed}

<div id="toast"></div>
<div id="tbHidden" hidden></div>

<script>
'use strict';
/* ================= constants ================= */
const M=18; // DIN module width (mm)
const COLORS={red:'#c62828',green:'#1f9d55',blue:'#1d5fd1',orange:'#c26a12',olive:'#9a961c',yellow:'#e8b800',white:'#f2f2ee',grey:'#6b7280',black:'#222'};
const CNAME={red:'אדום',green:'ירוק',blue:'כחול',orange:'כתום',olive:'זית',yellow:'צהוב',white:'לבן',grey:'אפור',black:'שחור'};
const ACC=['mcb','pb','pbl','pl22'];
const CISZ={K1:{w:80,h:131,n:'CI-K1 131×80'},K2:{w:100,h:181,n:'CI-K2 181×100'},K3:{w:120,h:222,n:'CI-K3 222×120'},K4:{w:160,h:240,n:'CI-K4 240×160'},K5:{w:200,h:280,n:'CI-K5 280×200'},C1:{w:187.5,h:250,n:'Ci 250×187.5'},C2:{w:250,h:375,n:'Ci 375×250'},C3:{w:375,h:250,n:'Ci 250×375'},C4:{w:375,h:375,n:'Ci 375×375'}};
const WCOL={brown:{base:'#8b5a2b',n:'חום'},black:{base:'#1d1d1d',n:'שחור'},grey:{base:'#8f8f8f',n:'אפור'},blue:{base:'#2563eb',n:'כחול'},yg:{base:'#f2c94c',dash:'#16a34a',n:'צהוב-ירוק'},red:{base:'#dc2626',n:'אדום'},white:{base:'#f1f1f1',n:'לבן'},orange:{base:'#f97316',n:'כתום'}};
const SEC={'0.75':1.8,'1':2,'1.5':2.3,'2.5':2.7,'4':3.1,'6':3.6,'10':4.4,'16':5.2};
const SECK=['0.75','1','1.5','2.5','4','6','10','16'];
let GRID=10;try{const g=localStorage.getItem('epd.grid');if(g!==null)GRID=+g;}catch(e){}
const GS=()=>GRID>0?GRID:1;const gs=v=>Math.round(v/GS())*GS();
function snapBox(o,x,y){let {w,h}=DEF[o.type].size(o);if(o.rot%180)[w,h]=[h,w];return [r2(gs(x-w/2)+w/2),r2(gs(y-h/2)+h/2)];}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=v=>Math.round(v*100)/100;
const uid=()=>Math.random().toString(36).slice(2,10);

/* ================= drawing helpers ================= */
/* The terminals in a terminal block set: single-phase, three-phase, four and five pole. */
const TBSETS={'S':[''],'1P':['L','N','PE'],'3P':['L1','L2','L3'],'4P':['L1','L2','L3','N'],'5P':['L1','L2','L3','N','PE']};
const TBSET=o=>TBSETS[o.p.set]||TBSETS['5P'];
function screw(x,y,r=4.2){const k=r*.62;return `<circle cx="${x}" cy="${y}" r="${r}" fill="#d4d4d4" stroke="#666" stroke-width=".6"/><path d="M${x-k} ${y-k}L${x+k} ${y+k}M${x+k} ${y-k}L${x-k} ${y+k}" stroke="#4a4a4a" stroke-width="${r*.22}"/>`;}
function txt(x,y,s,size=4,fill='#333',w=400,anchor='middle',fam='Arial,Helvetica,sans-serif'){if(LODMIN&&size<LODMIN)return '';return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" font-weight="${w}" text-anchor="${anchor}" dominant-baseline="central" font-family="${fam}">${esc(s)}</text>`;}
function spread(w,n){const a=[];for(let i=0;i<n;i++)a.push(r2(-w/2+w*(i+.5)/n));return a;}
function body(w,h){const x=-w/2,y=-h/2,b=17,mods=Math.round(w/M);let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.6" fill="#f4f4f1" stroke="#7d7d7d" stroke-width=".7"/>`;
 s+=`<rect x="${x+.4}" y="${y+.4}" width="${w-.8}" height="${b}" fill="#e3e3df"/><rect x="${x+.4}" y="${-y-b-.4}" width="${w-.8}" height="${b}" fill="#e3e3df"/>`;
 s+=`<path d="M${x} ${y+b}H${-x}M${x} ${-y-b}H${-x}" stroke="#b5b5b0" stroke-width=".5"/>`;
 for(let i=1;i<mods;i++){const xx=x+i*M;s+=`<path d="M${xx} ${y+b}V${-y-b}" stroke="#dcdcd7" stroke-width=".4"/>`;}
 return s;}
function dinTerms(w,top,bot){const t=[];spread(w,top.length).forEach((x,i)=>t.push([x,-37,top[i]]));spread(w,bot.length).forEach((x,i)=>t.push([x,37,bot[i]]));return t;}
/* A CI box without its lid: the shell's rim, the recessed inside with the lid's
   screw bosses in the corners and a mounting plate to build on. */
function ciOpenSVG(o){const {w,h}=DEF.cibox.size(o),K=String(o.p.size)[0]==='K',rim=K?5:7;
 let s=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${K?7:5}" fill="${K?'#1f1f1f':'#a9aba6'}" stroke="#000" stroke-width=".8"/><rect x="${-w/2+rim}" y="${-h/2+rim}" width="${w-2*rim}" height="${h-2*rim}" rx="${K?4:3}" fill="${K?'#3a3a3a':'#8f918c'}"/>`;
 const b=K?9:14;[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,c])=>s+=`<circle cx="${a*(w/2-b)}" cy="${c*(h/2-b)}" r="${K?4:6}" fill="${K?'#4a4a4a':'#a3a5a0'}" stroke="#222" stroke-width=".6"/><circle cx="${a*(w/2-b)}" cy="${c*(h/2-b)}" r="${K?1.4:2}" fill="#111"/>`);
 const pm=K?16:24;s+=`<rect x="${-w/2+pm}" y="${-h/2+pm}" width="${w-2*pm}" height="${h-2*pm}" rx="2" fill="${K?'#d7d8d3':'#e3e4df'}" stroke="#8a8b86" stroke-width=".8"/>`;
 if(o.p.tag)s+=txt(0,-h/2+pm-6,o.p.tag,K?5:8,'#ddd',700);return s;}
function ciLidSVG(o,isSel){const {w,h}=sizeOf(o),m=holesMask(o.id,o.x,o.y,q=>Math.abs(q.x-o.x)<w/2&&Math.abs(q.y-o.y)<h/2);
 return `<g data-id="${o.id}" transform="translate(${o.x} ${o.y}) rotate(${o.rot})">${m?m.svg+`<g mask="url(#${m.id})">`:''}${DEF.cibox.lid(o)}${m?'</g>':''}${isSel?`<rect x="${-w/2-2.5}" y="${-h/2-2.5}" width="${w+5}" height="${h+5}" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>`:''}</g>`;}
const ciLidOn=b=>b.p.lid!=='0';
function cutSVG(o){const {w,h}=sizeOf(o),H=DEF[o.type].hole(o);let s=`<path fill-rule="evenodd" d="M${-w/2} ${-h/2}h${w}v${h}h${-w}z M${-H.w/2} ${-H.h/2}v${H.h}h${H.w}v${-H.h}z" fill="#3a3f44" stroke="#111" stroke-width=".6"/>`;
 s+=`<rect x="${-H.w/2}" y="${-H.h/2}" width="${H.w}" height="${H.h}" fill="none" stroke="#0b0b0b" stroke-width="1.4"/>`;if(o.p.tag)s+=`<rect x="-18" y="${h/2+2}" width="36" height="10" rx="1" fill="#f3f3f0" stroke="#888" stroke-width=".4"/>`+txt(0,h/2+7,o.p.tag,5,'#222',700);return s;}
/* The openings cut in a front (a cabinet's doors and panels, or a closed board door),
   in its own coordinates: a mask that lets the parts inside show through them. */
function holesMask(id,ox,oy,inside){const hs=state.objs.filter(q=>DEF[q.type]?.cut&&inside(q)&&!hiddenFront(q));if(!hs.length)return null;
 return {id:'cm_'+id,svg:`<mask id="cm_${id}" maskUnits="userSpaceOnUse" x="-100000" y="-100000" width="200000" height="200000"><rect x="-100000" y="-100000" width="200000" height="200000" fill="#fff"/>`+hs.map(q=>{let {w,h}=DEF[q.type].hole(q);if(q.rot%180)[w,h]=[h,w];return `<rect x="${q.x-ox-w/2}" y="${q.y-oy-h/2}" width="${w}" height="${h}" fill="#000"/>`;}).join('')+'</mask>'};}
function bz(){return `<circle r="14.85" fill="#262626" stroke="#0d0d0d" stroke-width=".6"/><circle r="12.6" fill="#3d3d3d"/>`;}
function lg(o,y=21.5){return o.p.tag?`<rect x="-15" y="${y-4.5}" width="30" height="9" rx="1" fill="#f3f3f0" stroke="#888" stroke-width=".4"/>`+txt(0,y,o.p.tag,4.2,'#222',700):'';}
function hasDoor(o){return o.p.door&&o.p.door!=='none';}
function hingeX(o){return (o.p.hinge==='R'?1:-1);}
function hinges(o){const w=o.p.w,h=o.p.h,hs=hingeX(o),hl=h>=400?50:34,m=Math.max(hl/2+25,h*.13);const ys=[-(h/2-m),h/2-m];if(h>1000)ys.push(0);let s='';
 ys.forEach(y=>s+=`<rect x="${hs*w/2-4}" y="${y-hl/2}" width="8" height="${hl}" rx="3" fill="#6b7280" stroke="#374151" stroke-width=".7"/><path d="M${hs*w/2-4} ${y-hl/6}h8M${hs*w/2-4} ${y+hl/6}h8" stroke="#374151" stroke-width=".6"/>`);return s;}
function lockSVG(o,closed){const w=o.p.w,h=o.p.h,ex=-hingeX(o)*w/2,ins=w<300?28:w<500?38:45,lx=ex+hingeX(o)*ins;
 if(!closed){const lh=h>=400?30:20;return `<rect x="${ex+hingeX(o)*9-3}" y="${-lh/2}" width="6" height="${lh}" rx="1.5" fill="#9ca3af" stroke="#4b5563" stroke-width=".6"/>`;}
 if(o.p.door==='handle'&&h>=300){const hh=Math.min(150,h*.28),hw=Math.min(34,hh*.25);
  return `<rect x="${lx-hw/2-3}" y="${-hh/2-3}" width="${hw+6}" height="${hh+6}" rx="${hw/2+2}" fill="#1f1f1f"/><rect x="${lx-hw/2}" y="${-hh/2}" width="${hw}" height="${hh}" rx="${hw/2}" fill="#3a3a3a" stroke="#111" stroke-width=".8"/><rect x="${lx-hw/2+5}" y="${-hh/2+8}" width="${hw-10}" height="${hh*.55}" rx="${(hw-10)/2}" fill="#2a2a2a"/><circle cx="${lx}" cy="${hh/2-hw/2-2}" r="${hw*.28}" fill="#cfcfcf" stroke="#666" stroke-width=".6"/><rect x="${lx-1.2}" y="${hh/2-hw/2-2-hw*.18}" width="2.4" height="${hw*.36}" rx="1" fill="#333"/>`;}
 const R=h<300?9:12;return `<circle cx="${lx}" cy="0" r="${R}" fill="#2b2b2b" stroke="#000" stroke-width=".8"/><circle cx="${lx}" cy="0" r="${R*.62}" fill="#cfcfcf" stroke="#666" stroke-width=".6"/><path d="M${lx} ${-R*.4}L${lx+R*.35} ${R*.25}H${lx-R*.35}Z" fill="#333"/>`;}
function doorMarks(o){if(!hasDoor(o))return '';const w=o.p.w,h=o.p.h;return `<rect x="${-w/2+6}" y="${-h/2+6}" width="${w-12}" height="${h-12}" rx="4" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 4"/>`+hinges(o)+lockSVG(o,false);}
function doorSVG(o,isSel){const w=o.p.w,h=o.p.h,m=holesMask(o.id,o.x,o.y,q=>Math.abs(q.x-o.x)<w/2&&Math.abs(q.y-o.y)<h/2);let s=`<g data-id="${o.id}" transform="translate(${o.x} ${o.y}) rotate(${o.rot})">${m?m.svg+`<g mask="url(#${m.id})">`:''}<rect x="${-w/2+1.5}" y="${-h/2+1.5}" width="${w-3}" height="${h-3}" rx="5" fill="#d9dbd7" stroke="#8e8f8a" stroke-width="1.6"/><rect x="${-w/2+14}" y="${-h/2+14}" width="${w-28}" height="${h-28}" rx="3" fill="none" stroke="#c3c4bf" stroke-width="1.2"/>`;
 s+=hinges(o)+lockSVG(o,true);
 const f=Math.min(2,Math.max(1,w/380)),ty=-h/2+28+12*f;s+=`<g transform="translate(0 ${ty}) scale(${f}) translate(0 ${-ty})"><path d="M0 ${ty-14}L14 ${ty+11}H-14Z" fill="#f2c200" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 ${ty-6}L-3 ${ty+2}H1L-2 ${ty+8}L4 ${ty-1}H0Z" fill="#111"/>`;
 if(!o.p.tag)s+='</g>';if(o.p.tag)s+=`<rect x="-55" y="${ty+20}" width="110" height="18" rx="2" fill="#f5f5f2" stroke="#888" stroke-width=".6"/>`+txt(0,ty+29,o.p.tag,9,'#222',700);s+='</g>';if(m)s+='</g>';
 if(isSel)s+=`<rect x="${-w/2-2.5}" y="${-h/2-2.5}" width="${w+5}" height="${h+5}" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>`;
 return s+'</g>';}
// The board door swung open, shifted sideways past its own hinge; the hinge marks
// themselves stay on the board where they're attached.
function doorSVGOpen(o){const w=o.p.w,h=o.p.h,dir=hingeX(o),ox=dir*w;
 return `<g transform="translate(${o.x+ox} ${o.y}) rotate(${o.rot})"><rect x="${-w/2+1.5}" y="${-h/2+1.5}" width="${w-3}" height="${h-3}" rx="5" fill="#d9dbd7" stroke="#8e8f8a" stroke-width="1.6"/><rect x="${-w/2+14}" y="${-h/2+14}" width="${w-28}" height="${h-28}" rx="3" fill="none" stroke="#c3c4bf" stroke-width="1.2"/></g><g transform="translate(${o.x} ${o.y}) rotate(${o.rot})">${hinges(o)}</g>`;}
function isFrontV(c){return c.p.view==='front'||c.p.view==='door';}
/* A panels section's outer door is closed in the 'door' view. */
function secFace(o,sc){return sc.f==='cover'&&sc.od==='1'&&o.p.view==='door'?'door':sc.f;}
function cabG(o){const S0=o.p.secs&&o.p.secs.length?o.p.secs:[{w:800,f:'door'}],W=S0.reduce((a,z)=>a+(+z.w),0),H=+o.p.h,P=+o.p.plinth||0,E=o.p.eyes==='1'?40:0,T=E+H+P,x0=o.x-W/2,yt=o.y-T/2,y0=yt+E;let x=x0;
 const S=S0.map(z=>{const r=Object.assign({},z,{w:+z.w,x0:x,x1:x+(+z.w)});x+=+z.w;return r;});return {W,H,P,E,T,x0,yt,y0,S,floor:y0+H+P};}
function cabHingeYs(g){const a=g.y0+180,b=g.y0+g.H-180;return g.H>1700?[a,(a+b)/2,b]:[a,b];}
function swingHandle(x,y){return `<rect x="${x-20}" y="${y-88}" width="40" height="176" rx="20" fill="#1f1f1f"/><rect x="${x-17}" y="${y-85}" width="34" height="170" rx="17" fill="#3a3a3a" stroke="#111" stroke-width="1"/><rect x="${x-11}" y="${y-74}" width="22" height="95" rx="11" fill="#2a2a2a"/><circle cx="${x}" cy="${y+56}" r="9" fill="#cfcfcf" stroke="#666" stroke-width="1"/><rect x="${x-1.6}" y="${y+50}" width="3.2" height="12" rx="1.2" fill="#333"/>`;}
function cabFront(o){const g=cabG(Object.assign({},o,{x:0,y:0}));let s='';
 g.S.forEach((sc,i)=>{const face=secFace(o,sc);if(face==='none')return;const fx0=sc.x0+3,fx1=sc.x1-3,fy0=g.y0+3,fy1=g.y0+g.H-3,fw=fx1-fx0,fh=fy1-fy0;
  if(face==='cover'){const n=Math.max(1,Math.round(g.H/450)),ph=(fh-(n-1)*4)/n;for(let k=0;k<n;k++){const py=fy0+k*(ph+4);s+=`<rect x="${fx0}" y="${py}" width="${fw}" height="${ph}" rx="3" fill="#d9dbd7" stroke="#8e8f8a" stroke-width="2"/>`;
    [[fx0+22,py+22],[fx1-22,py+22],[fx0+22,py+ph-22],[fx1-22,py+ph-22]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="7" fill="#c4c5c0" stroke="#6f706b" stroke-width="1"/><path d="M${x-4.5} ${y}h9" stroke="#444" stroke-width="2"/>`);}return;}
  const lv=face==='double'?[[fx0,fx0+fw/2-2,'L',0],[fx0+fw/2+2,fx1,'R',1]]:[[fx0,fx1,sc.hinge==='R'?'R':'L',1]];
  const hy=Math.min(fy1-140,Math.max(fy0+140,g.floor-1050));
  lv.forEach(([a,b,hg,hasH])=>{s+=`<rect x="${a}" y="${fy0}" width="${b-a}" height="${fh}" rx="4" fill="#d9dbd7" stroke="#8e8f8a" stroke-width="2.4"/><rect x="${a+22}" y="${fy0+22}" width="${b-a-44}" height="${fh-44}" rx="3" fill="none" stroke="#c3c4bf" stroke-width="1.6"/>`;
   const hx=hg==='L'?a:b;cabHingeYs(g).forEach(y=>s+=`<rect x="${hx-5}" y="${y-30}" width="10" height="60" rx="3" fill="#6b7280" stroke="#374151" stroke-width=".8"/>`);
   if(hasH)s+=swingHandle(hg==='L'?b-50:a+50,hy);});
  const cx=(sc.x0+sc.x1)/2,ty=fy0+70;s+=`<g transform="translate(${cx} ${ty}) scale(2.4)"><path d="M0 -14L14 11H-14Z" fill="#f2c200" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 -6L-3 2H1L-2 8L4 -1H0Z" fill="#111"/></g>`;
  if(o.p.tag&&i===0)s+=`<rect x="${cx-110}" y="${ty+42}" width="220" height="36" rx="3" fill="#f5f5f2" stroke="#888" stroke-width="1"/>`+txt(cx,ty+60,o.p.tag,18,'#222',700);});
 return s;}
/* The doors swung open, each leaf shifted sideways past its own hinge — a
   double door opens to the left AND right, a single door opens toward
   whichever side it's hinged on. The hinge marks stay put on the frame;
   only the leaf itself moves, so it reads as open rather than vanished. */
function cabFrontOpen(o){const g=cabG(Object.assign({},o,{x:0,y:0}));let s='';
 g.S.forEach(sc=>{const face=secFace(o,sc);if(face!=='door'&&face!=='double')return;
  const fx0=sc.x0+3,fx1=sc.x1-3,fy0=g.y0+3,fy1=g.y0+g.H-3,fh=fy1-fy0;
  const lv=face==='double'?[[fx0,fx0+(fx1-fx0)/2-2,'L'],[fx0+(fx1-fx0)/2+2,fx1,'R']]:[[fx0,fx1,sc.hinge==='R'?'R':'L']];
  lv.forEach(([a,b,hg])=>{const w=b-a,dir=hg==='L'?-1:1,ox=dir*w;
   s+=`<rect x="${a+ox}" y="${fy0}" width="${w}" height="${fh}" rx="4" fill="#d9dbd7" stroke="#8e8f8a" stroke-width="2.4"/><rect x="${a+22+ox}" y="${fy0+22}" width="${w-44}" height="${fh-44}" rx="3" fill="none" stroke="#c3c4bf" stroke-width="1.6"/>`;
   const hx=hg==='L'?a:b;cabHingeYs(g).forEach(y=>s+=`<rect x="${hx-5}" y="${y-30}" width="10" height="60" rx="3" fill="#6b7280" stroke="#374151" stroke-width=".8"/>`);});});
 return s;}
function cabSecAt(q){for(const c of state.objs){if(c.type!=='cabinet'||!isFrontV(c))continue;const g=cabG(c);for(const sc of g.S){if(sc.f==='none')continue;if(q.x>sc.x0&&q.x<sc.x1&&q.y>g.y0&&q.y<g.y0+g.H)return {type:'_sec',x:(sc.x0+sc.x1)/2,y:g.y0+g.H/2,_r:{w:sc.w,h:g.H},p:{size:'X'}};}}return null;}
function lcSz(o){const r=String(o.p.rating);return /D(80|95)/.test(r)?{w:85,h:127}:/D(40A|50A|65A)/.test(r)?{w:55,h:85}:{w:45,h:77};}
const nsxFrame=o=>+((String(o.p.rating).match(/NSXm?(\d+)/)||[])[1]||250);
// The ComPacT front: dark case, pole shields with screws top and bottom, a light
// face with the toggle (ON up), the name and the trip unit with its dials.
function nsxDraw(o,{w,h},mini){const sh=h*(mini?.15:.17),fw=w*.84,fx=-fw/2,fy=-h/2+sh+h*.03,fh=h-2*sh-h*.06,trip=String(o.p.rating).split(' ').slice(1).join(' '),frame=String(o.p.rating).split(' ')[0];
 let s=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${w*.04}" fill="#2a2d30" stroke="#0b0b0b" stroke-width=".8"/>`;
 s+=`<rect x="${-w/2+1.5}" y="${-h/2+1.5}" width="${w-3}" height="${sh}" rx="2" fill="#3a3f44"/><rect x="${-w/2+1.5}" y="${h/2-sh-1.5}" width="${w-3}" height="${sh}" rx="2" fill="#3a3f44"/>`;
 s+=`<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" rx="3" fill="#d9dcdf" stroke="#9aa0a6" stroke-width=".6"/>`;
 s+=`<rect x="${fx+3}" y="${fy+3}" width="${fw*.18}" height="${fh*.06}" rx="1" fill="#3dcd58"/>`+txt(fx+fw-3,fy+fh*.06,'ComPacT',Math.max(3,fw*.07),'#3dcd58',800,'end');
 const tw=fw*.22,th=fh*.36,ty=fy+fh*.14;
 s+=`<rect x="${-tw/2-2}" y="${ty-2}" width="${tw+4}" height="${th+4}" rx="2" fill="#5b6066"/><rect x="${-tw/2}" y="${ty}" width="${tw}" height="${th}" rx="1.5" fill="#1c1e20"/><rect x="${-tw/2+1.5}" y="${ty+1.5}" width="${tw-3}" height="${th*.42}" rx="1" fill="#3a3d40"/>`;

/* ================= single-line diagram symbols =================
   IEC-style line symbols for the "חד קווי" tab: black on the white sheet, the
   way they're printed. Most stand 60 tall with a terminal at the top and one at
   the bottom (the grid is 10), so a feeder is a straight drop from the busbar.
   Each shows its designation, rating and description beside it. */
const SK='#111';
const sL=(x1,y1,x2,y2,w=2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${SK}" stroke-width="${w}" stroke-linecap="round"/>`;
const sC=(x,y,r,fill='#fff',w=2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${SK}" stroke-width="${w}"/>`;
const sR=(x,y,w,h,fill='#fff',sw=2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${SK}" stroke-width="${sw}"/>`;
const sT=(x,y,s,size=9,w=700,anchor='middle')=>txt(x,y,s,size,SK,w,anchor);
const IO=()=>[[0,-30,''],[0,30,'']],TOP=()=>[[0,-30,'']];
function sLbl(o,w){const ls=[[o.p.tag,9,700],[o.p.rating,7.5,400],[o.p.desc,7.5,400]].filter(l=>l[0]);const x=w/2+5;return ls.map((l,i)=>txt(x,-10+i*10.5,l[0],l[1],SK,l[2],'start')).join('');}
// A switching contact: the fixed contact's mark tells breaker / isolator / contactor / switch.
function sSwitch(mark){let s=sL(0,-30,0,-12)+sL(0,12,0,30)+sL(0,12,-11,-13);
 if(mark==='x')s+=sL(-4,-16,4,-8)+sL(-4,-8,4,-16);
 if(mark==='bar')s+=sL(-5,-12,5,-12);
 if(mark==='arc')s+=`<path d="M-5 -12a5 5 0 0 0 10 0" fill="none" stroke="${SK}" stroke-width="2"/>`;
 if(mark==='circ')s+=sC(0,-12,3);
 return s;}
// Control circuit pieces (IEC 60617): a contact drawn on the 60-tall line, and the
// way it is worked, drawn to its left on a dashed link from the blade.
const cNO=()=>sL(0,-30,0,-12)+sL(0,12,0,30)+sL(0,12,-11,-13),cNC=()=>sL(0,-30,0,-12)+sL(0,-12,8,-12)+sL(0,12,0,30)+sL(0,12,10,-15);
function cAct(kind,mx,my){const d=`<line x1="${mx}" y1="${my}" x2="-18" y2="${my}" stroke="${SK}" stroke-width="1.4" stroke-dasharray="3 2"/>`,P=(dd,f='none')=>`<path d="${dd}" fill="${f}" stroke="${SK}" stroke-width="1.8" stroke-linejoin="round"/>`;
 if(kind==='push')return d+P(`M-18 ${my-6}V${my+6}M-18 ${my-6}h-4M-18 ${my+6}h-4`);
 if(kind==='turn')return d+P(`M-18 ${my}h-3v-6h-5v12h-3`);
 if(kind==='mush')return d+P(`M-18 ${my-8}V${my+8}`)+P(`M-18 ${my-8}a8 8 0 0 0 0 16z`,SK);
 if(kind==='key')return d+P(`M-18 ${my}h-5`)+sC(-26,my,3,'#fff',1.8);
 if(kind==='float')return d+P(`M-18 ${my}h-2`)+sC(-25,my,5,'#fff',1.8)+P(`M-31 ${my+8}h12`);
 if(kind==='press')return d+sR(-31,my-6,13,12,'#fff',1.8)+sT(-24.5,my+3.5,'p',9);
 if(kind==='temp')return d+sR(-31,my-6,13,12,'#fff',1.8)+sT(-24.5,my+3.5,'θ',9);
 if(kind==='limit')return d+P(`M-18 ${my-6}l-8 6l8 6z`);
 if(kind==='delay')return d+P(`M-11 ${my-5}a5 5 0 0 0 0 10`);
 return '';}

function setWire(on){if(on&&measMode)setMeas(null);wireMode=on;if(!on&&draft)finishWire();draft=null;if(on&&pMode)closePanel();buildWirePanel();renderNow();updateBar();}
function nearestTerm(x,y,rad){let best=null,bd=rad;for(const o of state.objs){if(o.type==='wire')continue;termsOf(o).forEach((t,i)=>{const [X,Y]=fromLocal(o,t[0],t[1]);const d=Math.hypot(X-x,Y-y);if(d<bd){bd=d;best={r:o.id,t:i};}});}return best;}
function wireTap(x,y){const tr=nearestTerm(x,y,Math.max(5,20/view.s));let pt=tr?tr:{x:gs(x),y:gs(y)};
 if(!draft){if(!tr&&!orth){}draft={pts:[pt]};renderNow();updateBar();return;}
 const last=draft.pts[draft.pts.length-1],prev=resolve(last),np=resolve(pt);if(!prev||!np)return;
 if(tr&&last.r===tr.r&&last.t===tr.t)return;
 if(orth&&Math.abs(prev.x-np.x)>.5&&Math.abs(prev.y-np.y)>.5){
  if(!tr){if(Math.abs(np.x-prev.x)<Math.abs(np.y-prev.y))pt.x=prev.x;else pt.y=prev.y;}
  else draft.pts.push(last.r?{x:prev.x,y:np.y}:{x:np.x,y:prev.y});}
 draft.pts.push(pt);
 if(tr&&draft.pts.length>=2){finishWire();return;}
 renderNow();}
/* a new wire's colour follows what it connects to: anything touching an N
   terminal (or an N feed) is blue; branching off a terminal that already has a
   wire takes that wire's colour. */
function termLbl(p){if(!p||!p.r)return '';const o=get(p.r);if(!o)return '';if(o.type==='sfeed')return o.p.feed||'';if(o.type==='tb'&&o.p.kind==='blue')return 'N';const t=termsOf(o)[p.t];return t&&t[2]!=null?String(t[2]).trim():'';}
function wireAutoColor(ends,def){if(ends.some(p=>/^N\d*$/.test(termLbl(p))))return 'blue';
 for(const p of ends){if(!p||!p.r)continue;const w=state.objs.find(o=>o.type==='wire'&&o.pts.some(q=>q.r===p.r&&q.t===p.t));if(w)return w.p.color;}return def;}
function finishWire(){if(draft&&draft.pts.length>=2){const w={id:uid(),type:'wire',p:{color:wireAutoColor([draft.pts[0],draft.pts[draft.pts.length-1]],wireColor),sec:wireSec,name:'חוט'},pts:draft.pts};state.objs.push(w);draft=null;commit();toast('החוט נוסף');}else draft=null;renderNow();updateBar();}

/* A DIN-rail part goes onto the nearest rail it is held over (within about half
   its own height), next to its neighbours, and never on top of another part:
   if the spot is taken it lands in the nearest free gap on that rail. DROPR is
   the rail it will land on, highlighted while dragging. */
let DROPR=null,DROPFULL=false;
function snapRail(o,x,y){const hw=sizeOf(o).w/2,reach=Math.max(30,sizeOf(o).h/2+12);
 const moving=new Set(G&&G.mode==='drag'&&G.o===o?G.kids.map(k=>k.q):[]);
 let best=null;
 for(const r of railsFor(o)){const [u,v]=toLocal(r,x,y),L=r.p.len;
  if(Math.abs(v)<reach&&u>-L/2-hw-20&&u<L/2+hw+20&&(!best||Math.abs(v)<Math.abs(best.v)))best={r,u,v};}
 if(!best)return snapBox(o,x,y);
 const {r,u}=best,L=r.p.len;
 const iv=state.objs.filter(q=>q!==o&&!moving.has(q)&&onRail(q,r)).map(q=>{const [uq]=toLocal(r,q.x,q.y),qh=sizeOf(q).w/2;return [uq-qh,uq+qh];});
 const fits=c=>c-hw>=-L/2-.01&&c+hw<=L/2+.01&&iv.every(([a,b])=>c+hw<=a+.5||c-hw>=b-.5);
 let nu=r2(-L/2+hw+gs(u+L/2-hw)),d=Math.max(7,GS()/2+1);
 for(const [a,b] of iv)for(const t of [b+hw,a-hw])if(Math.abs(t-u)<d){d=Math.abs(t-u);nu=t;}
 nu=Math.min(L/2-hw,Math.max(-L/2+hw,nu));
 if(!fits(nu)){const c=[-L/2+hw,L/2-hw];iv.forEach(([a,b])=>c.push(b+hw,a-hw));
  const ok=c.filter(fits).sort((p,q)=>Math.abs(p-u)-Math.abs(q-u));
  if(!ok.length){if(G&&G.o===o){DROPR=r;DROPFULL=true;return [G.ox,G.oy];}return snapBox(o,x,y);}nu=ok[0];}
 if((o.rot%180)!==(r.rot%180))o.rot=r.rot;if(G&&G.o===o)DROPR=r;return fromLocal(r,r2(nu),0);}
function dropSVG(){if(!DROPR||!G||G.mode!=='drag')return '';const B=bbW(DROPR),m=4/view.s;

   can be reordered, moved from one bar to the other or hidden, in a dialog
   where each bar is a row of chips dragged between rows. The arrangement is
   kept per device in localStorage and applied to the real bars at once. */
const TB_KEY='ohadcad.toolbar.v1',TBZ={rail:'rail',doc:'docTabs'};
const TB_DEF={rail:[],doc:[],hide:[]};
(()=>{let n=0;for(const [z,id] of Object.entries(TBZ))for(const el of [...$(id).children]){if(el.id==='saveSt')continue;
  el.dataset.tb=el.id||(el.dataset.doc?'doc-'+el.dataset.doc:'sep'+(++n));el.dataset.home=z;TB_DEF[z].push(el.dataset.tb);}})();
const tbEl=k=>document.querySelector(`[data-tb="${k}"]`);
function tbCur(){const L={rail:[],doc:[],hide:[]};for(const [z,id] of Object.entries(TBZ))[...$(id).children].forEach(el=>{if(el.dataset.tb)L[z].push(el.dataset.tb);});
 [...$('tbHidden').children].forEach(el=>L.hide.push(el.dataset.tb));return L;}
function tbApply(L){const seen=new Set(),box={rail:$('rail'),doc:$('docTabs'),hide:$('tbHidden')};
 for(const z of ['rail','doc','hide'])(L[z]||[]).forEach(k=>{const el=tbEl(k);if(el&&!seen.has(k)){seen.add(k);box[z].appendChild(el);}});
 // buttons added in a later version, unknown to a saved arrangement, go back to their own bar
 document.querySelectorAll('[data-tb]').forEach(el=>{if(seen.has(el.dataset.tb))return;const D=TB_DEF[el.dataset.home],i=D.indexOf(el.dataset.tb),pv=i>0&&tbEl(D[i-1]);if(pv&&seen.has(D[i-1]))pv.after(el);else box[el.dataset.home].appendChild(el);seen.add(el.dataset.tb);});
 $('docTabs').appendChild($('saveSt'));railHint();}
try{const L=JSON.parse(localStorage.getItem(TB_KEY)||'null');if(L)tbApply(L);}catch(e){}
function tbStore(){try{localStorage.setItem(TB_KEY,JSON.stringify(tbCur()));}catch(e){}}
/* Drag a button right on the bar: with the mouse, press and move; with a finger,
   hold it a moment (so the bar still scrolls with a plain swipe) and then move.
   It can go anywhere along its bar or onto the other bar; the order is kept. */
(()=>{const BARS='#rail,#docTabs';let D=null,swallow=false;
 const barAt=(x,y)=>{for(const id of ['rail','docTabs']){const r=$(id).getBoundingClientRect();if(x>=r.left-6&&x<=r.right+6&&y>=r.top-14&&y<=r.bottom+14)return $(id);}return null;};
 function start(){const el=D.el,r=el.getBoundingClientRect(),g=el.cloneNode(true);g.removeAttribute('id');g.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  g.classList.add('tbfly');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);D.g=g;D.ox=D.x-r.left;D.oy=D.y-r.top;
  el.classList.add('tbdragging');document.body.classList.add('tbmoving');if(navigator.vibrate&&D.touch)try{navigator.vibrate(15);}catch(e){}place(D.x,D.y);}
 function place(x,y){D.g.style.left=x-D.ox+'px';D.g.style.top=y-D.oy+'px';const bar=barAt(x,y);document.querySelectorAll('.tbtarget').forEach(b=>b!==bar&&b.classList.remove('tbtarget'));if(!bar)return;bar.classList.add('tbtarget');
  const br=bar.getBoundingClientRect();if(x<br.left+30)bar.scrollLeft-=10;else if(x>br.right-30)bar.scrollLeft+=10;
  const rtl=getComputedStyle(bar).direction==='rtl';let best=null,bd=1e9;
  for(const q of bar.children){if(q===D.el||!q.dataset.tb)continue;const b=q.getBoundingClientRect(),d=Math.abs(x-(b.left+b.width/2));if(d<bd){bd=d;best=q;}}
  if(!best){bar.insertBefore(D.el,bar.querySelector('#saveSt'));return;}
  const b=best.getBoundingClientRect(),after=rtl?x<b.left+b.width/2:x>b.left+b.width/2;bar.insertBefore(D.el,after?best.nextSibling:best);
  if(bar.id==='docTabs')bar.appendChild($('saveSt'));}
 function end(drop){if(!D)return;clearTimeout(D.t);const d=D;D=null;if(!d.g)return;d.g.remove();d.el.classList.remove('tbdragging');document.body.classList.remove('tbmoving');
  document.querySelectorAll('.tbtarget').forEach(b=>b.classList.remove('tbtarget'));swallow=true;setTimeout(()=>swallow=false,60);
  if(drop){tbStore();railHint();}}
 document.addEventListener('pointerdown',e=>{if(D||(e.pointerType==='mouse'&&e.button!==0))return;const el=e.target.closest('[data-tb]');if(!el||!el.closest(BARS))return;
  D={el,x:e.clientX,y:e.clientY,id:e.pointerId,touch:e.pointerType!=='mouse'};
  if(D.touch)D.t=setTimeout(()=>{if(D&&!D.g)start();},380);},true);
 document.addEventListener('pointermove',e=>{if(!D||e.pointerId!==D.id)return;
  if(!D.g){const m=Math.hypot(e.clientX-D.x,e.clientY-D.y);if(D.touch){if(m>10){clearTimeout(D.t);D=null;}return;}if(m<7)return;start();}
  e.preventDefault();place(e.clientX,e.clientY);},true);
 document.addEventListener('pointerup',e=>{if(D&&e.pointerId===D.id)end(true);},true);
 document.addEventListener('pointercancel',e=>{if(D&&e.pointerId===D.id)end(!!D.g);},true);
 // a held finger must not scroll the bar or open the long-press menu
 document.addEventListener('touchmove',e=>{if(D&&D.g)e.preventDefault();},{passive:false,capture:true});
 document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest(BARS))e.preventDefault();},true);
 // the click that ends a drag is not a press of the button
 document.addEventListener('click',e=>{if(swallow&&e.target.closest&&e.target.closest(BARS)){e.preventDefault();e.stopImmediatePropagation();swallow=false;}},true);})();
function tbChip(k){const el=tbEl(k);if(!el)return '';if(el.classList.contains('sep'))return `<div class="tbc sepc" data-c="${k}"><i></i>מפריד</div>`;
 const sv=el.querySelector('svg'),lb=el.querySelector('span')?.textContent||(el.id==='bGrid'?'גריד':'')||el.textContent.trim()||el.title||k;
 return `<div class="tbc" data-c="${k}">${sv?sv.outerHTML.replace(/ id="[^"]*"/g,''):''}<span>${esc(lb)}</span></div>`;}
function tbZones(){const L=tbCur(),Z=[['rail','סרגל הכלים (עליון)'],['doc','סרגל המסמכים (שני)'],['hide','מוסתרים — גרור לכאן כפתור שלא צריך']];
 return `<div class="hint">טיפ: אפשר לגרור כפתורים ישירות על הסרגלים עצמם — בעכבר לוחצים וגוררים, באצבע מחזיקים רגע וגוררים. כאן אפשר גם להסתיר כפתור (גרור ל"מוסתרים") או לאפס הכול.</div>`+
  Z.map(([z,t])=>`<div class="tbz${z==='hide'?' hz':''}"><div class="tbzt">${t}</div><div class="tbzl" data-z="${z}">${L[z].map(tbChip).join('')}</div></div>`).join('');}
function tbEditor(){modal('סידור כפתורי הסרגלים',tbZones(),[{t:'סיום',cls:'pri'},{t:'איפוס לסידור המקורי',fn:()=>{tbApply(TB_DEF);try{localStorage.removeItem(TB_KEY);}catch(e){}$('mBody').innerHTML=tbZones();toast('הסרגלים חזרו לסידור המקורי');return false;}}]);
 $('mBody').onpointerdown=tbDown;}
function tbDown(e){const c=e.target.closest('.tbc');if(!c||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();
 const r=c.getBoundingClientRect(),gh=c.cloneNode(true);gh.classList.add('tbghost');gh.style.width=r.width+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';document.body.appendChild(gh);
 c.classList.add('tbdrag');const ox=e.clientX-r.left,oy=e.clientY-r.top,mb=$('mBody');let last=null;
 // held near the top or bottom of the list, it keeps scrolling so a far row can be reached
 const auto=setInterval(()=>{if(!last)return;const mr=mb.getBoundingClientRect(),y=last.clientY;const d=y<mr.top+40?-10:y>mr.bottom-40?10:0;if(d){const t0=mb.scrollTop;mb.scrollTop+=d;if(mb.scrollTop!==t0)mv(last);}},30);
 const mv=ev=>{gh.style.left=ev.clientX-ox+'px';gh.style.top=ev.clientY-oy+'px';
  last=ev;
  const t=document.elementFromPoint(ev.clientX,ev.clientY),zl=t&&(t.closest('.tbzl')||t.closest('.tbz')?.querySelector('.tbzl'));if(!zl)return;
  let best=null,bd=1e9;for(const q of zl.children){if(q===c)continue;const b=q.getBoundingClientRect(),d=Math.hypot(ev.clientX-(b.left+b.width/2),(ev.clientY-(b.top+b.height/2))*2);if(d<bd){bd=d;best=q;}}
  if(!best){zl.appendChild(c);return;}const b=best.getBoundingClientRect(),after=ev.clientX<b.left+b.width/2; // right-to-left rows

  const L={rail:[],doc:[],hide:[]};mb.querySelectorAll('.tbzl').forEach(zl=>zl.querySelectorAll('.tbc').forEach(q=>L[zl.dataset.z].push(q.dataset.c)));
  tbApply(L);tbStore();};

  put('endstop',{},'מעצור קצה');const x0=u;items.forEach(i=>put(i[0],i[1],i[2]));const x1=u;put('endstop',{},'מעצור קצה');r.run=[x0,x1];return r;};
 const duct=(x,y,len,dw=60,rot=0)=>add('duct',{len,dw},x,y,'תעלת חיווט',rot);

 const chain=(list,x,y0,step=100)=>{let prev=null;return list.map(([t,p],i)=>{const e=add(t,p,x,y0+i*step);if(prev)wire(prev,bot(prev),e,top(e));prev=e;return e;});};

 const bt=(b,x)=>{let bi=0,bd=1e9;termsOf(b).forEach((t,i)=>{const d=Math.abs(b.x+t[0]-x);if(d<bd){bd=d;bi=i;}});return bi;};

 $('mBody').onclick=async e=>{const b=e.target.closest('[data-tp]');if(!b)return;closeModal();if(typeof flushSave==='function')await flushSave();newFromTemplate(+b.dataset.tp);};}

function newProject(){modal('פרויקט חדש',`<div class="fld"><label>שם הלוח</label><input id="f_pn" value="לוח חדש"></div><div class="hint">${SH?'הלוח החדש יישמר אוטומטית בתיקייה המשותפת, וגם הלוח הנוכחי נשמר.':'מומלץ לשמור את הלוח הנוכחי לפני כן.'}</div>`,[{t:'ריק',fn:async()=>{const n=$('f_pn').value||'לוח חדש';await flushSave();setCloud(null);lastSaved=null;cloudStamp=null;state={name:n,objs:[]};sel=null;hist=[];hi=-1;commit();renderNow();fit();flushSave();}},{t:'עם ארון ופסים',cls:'pri',fn:async()=>{const n=$('f_pn').value||'לוח חדש';await flushSave();setCloud(null);lastSaved=null;cloudStamp=null;starter(false);state.name=n;sel=null;hist=[];hi=-1;commit();renderNow();fit();flushSave();}},{t:'מתבנית…',fn:()=>{setTimeout(templatesDialog,0);}},{t:'ביטול'}]);}
function saveAs(){modal('שמירת פרויקט',`<div class="fld"><label>שם</label><input id="f_sn" value="${esc(state.name)}"></div><div class="hint">השמירה נשמרת בדפדפן במכשיר הזה בלבד. לגיבוי או מעבר למכשיר אחר — "העתק קובץ פרויקט" מהתפריט.</div>`,
 [{t:'שמור',cls:'pri',fn:()=>{const n=($('f_sn').value||'').trim()||'לוח';state.name=n;const p=loadProjects();p[n]=JSON.parse(JSON.stringify(state));if(saveProjects(p)){commit();updateBar();toast('נשמר: '+n);}else toast('השמירה נכשלה בדפדפן הזה');}},{t:'ביטול'}]);}
function openProjects(){const p=loadProjects(),ks=Object.keys(p);
 modal('פרויקטים שמורים',ks.length?`<div class="plist">${ks.map(k=>`<div style="display:flex;gap:8px"><button data-k="${esc(k)}" class="op">📋 ${esc(k)} <span style="color:#999;font-size:13px">(${p[k].objs.length} רכיבים)</span></button><button data-d="${esc(k)}" style="width:52px;flex:none;text-align:center">🗑</button></div>`).join('')}</div>`:'<div class="hint">אין עדיין פרויקטים שמורים.</div>');

function bomData(){return withPanel(bomData0);}
// single-line diagram: one row per kind of symbol (name + rating), with the tags drawn on it
function bomDataSld(){return withDoc('sld',()=>{const rows={},SKIP=['wire','sframe','sfeed','label','mdim','underlay'];state.objs.forEach(o=>{if(SKIP.includes(o.type)||DRAWT.has(o.type)||!DEF[o.type])return;
  const k=(o.p.name||o.type)+(o.p.rating?' '+o.p.rating:'');const r=rows[k]=rows[k]||{n:0,tags:[]};r.n++;if(o.p.tag)r.tags.push(o.p.tag);});
 return Object.keys(rows).map(k=>{const r=rows[k],tg=r.tags.sort((a,b)=>a.localeCompare(b,'he',{numeric:true}));return [k+(tg.length?` (${tg.length>6?tg.slice(0,6).join(', ')+'…':tg.join(', ')})`:''),`${r.n} יח'`];});});}
function bomData0(){const rows={};state.objs.forEach(o=>{if(o.type==='underlay'||o.type==='nmap')return;if(o.type==='wire'){const k=`חוט ${WCOL[o.p.color]?.n} ${o.p.sec} ממ"ר`;rows[k]=rows[k]||{n:0,len:0,w:1};rows[k].len+=wireLen(o);return;}
  if(o.type==='conduit'){const D=+o.p.dn||20,kl=`צינור מרירון ${D} מ"מ`,kb=`קשת מרירון ${D} מ"מ`,nb=cabBends(o).filter(Boolean).length;rows[kl]=rows[kl]||{n:0,len:0};rows[kl].len+=cabLength(o);rows[kl].n++;if(nb){rows[kb]=rows[kb]||{n:0};rows[kb].n+=nb;}return;}
  let k=o.p.name+(o.p.rating&&!['label'].includes(o.type)?' '+o.p.rating:'');if(o.type==='cable'||o.type==='traysh'||o.type==='traymesh'){const g=o.type==='cable'?cabG2(o):null;k=o.type==='cable'?`כבל ${CNAME[o.p.color]||''} ${g.n}×${o.p.sec} ממ"ר`:`${o.type==='traysh'?'תעלת פח':'תעלת רשת'} ${o.p.tw} מ"מ`;rows[k]=rows[k]||{n:0,len:0};rows[k].len+=o.type==='cable'?cabLength(o):o.p.len;rows[k].n++;return;}
  if(o.type==='rail'||o.type==='duct'||o.type==='busbar'||o.type==='partition'){k=o.p.name+(o.type==='duct'?` ${o.p.dw}מ"מ`:'');rows[k]=rows[k]||{n:0,len:0};rows[k].len+=o.p.len;rows[k].n++;return;}
  if(o.type==='cabinet'){const g=cabG(o),FN={door:'דלת',double:'דלת כפולה',cover:'פאנלים מוברגים',none:'ללא חזית'};g.S.forEach(sc=>{const kk=`שדה ארון ${sc.w}×${g.H} — ${FN[sc.f]}`;rows[kk]=rows[kk]||{n:0};rows[kk].n++;});if(g.P){const kk=`סוקל ${g.P} מ"מ`;rows[kk]=rows[kk]||{n:0,len:0};rows[kk].len+=g.W;rows[kk].n++;}return;}
  if(DRAWT.has(o.type))return;if(o.type==='enclosure')k=`לוח ${o.p.w}×${o.p.h} `+({key:'עם דלת ומנעול',handle:'עם ידית ומנעול'}[o.p.door]||'ללא דלת');if(o.type==='cibox')k='קופסה '+CISZ[o.p.size].n+(o.p.window==='1'?' עם חלון':'');if(o.type==='wmag')k=`אלקטרומגנט לנעילת דלת ${o.p.hold||280} ק"ג ${o.p.dcv==='24'?24:12}V DC`+(o.p.mon==='1'?' עם מגע מצב':'');if(o.type==='wcard')k=(o.p.rdr==='kp'?'קורא כרטיסים + קודן':'קורא כרטיסים')+` ${o.p.dcv==='24'?24:12}V DC`;if(DEF[o.type].front&&DEF[o.type].edit.includes('color'))k=o.p.name+' '+CNAME[o.p.color];rows[k]=rows[k]||{n:0};rows[k].n++;});
 const ks=Object.keys(rows);const line=k=>{const r=rows[k];return r.len!==undefined?`${(r.len/1000).toFixed(2)} מ'`+(r.n?` (${r.n} יח')`:''):`${r.n} יח'`;};
 return ks.map(k=>[k,line(k)]);}
function bom(){const d=bomData(),ds=bomDataSld(),ks=d.map(r=>r[0]),L=Object.fromEntries(d),line=k=>L[k];
 const txtOut=`רשימת ציוד — ${state.name}\n`+ks.map(k=>`${k}\t${line(k)}`).join('\n')+(ds.length?`\n\nחד קווי\n`+ds.map(r=>r.join('\t')).join('\n'):'');
 modal('רשימת ציוד',(ks.length?`<table><tr><th>פריט</th><th>כמות</th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td style="white-space:nowrap">${line(k)}</td></tr>`).join('')}</table><div class="hint" style="margin-top:10px">אורכי חוטים משורטטים לפי קנה מידה 1:1 (מ"מ) ואינם כוללים עודפים.</div>`:'<div class="hint">הלוח ריק.</div>')+(ds.length?`<div class="grp" style="margin-top:14px">⚡ חד קווי</div><table><tr><th>פריט</th><th>כמות</th></tr>${ds.map(([k,q])=>`<tr><td>${esc(k)}</td><td style="white-space:nowrap">${q}</td></tr>`).join('')}</table>`:''),
  [{t:'העתק כטקסט',cls:'pri',fn:()=>{copyText(txtOut);return false;}},{t:'סגור'}]);}

async function saveFile(fname,data){try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){try{await d.save({filename:fname,data});toast('נשמר: '+fname);}catch(e){if(e&&e.code==='declined')return;toast('השמירה נכשלה'+(e&&e.code?' ('+e.code+')':''));}return;}}}catch(e){}
 try{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}catch(e){toast('ההורדה חסומה כאן');}}
function dataUrlToBlob(u){const [h,b]=u.split(','),bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.split(':')[1].split(';')[0]});}

function tbLoad(){try{return JSON.parse(localStorage.getItem('epd.tb')||'{}');}catch(e){return {};}}
function tbSave(t){try{localStorage.setItem('epd.tb',JSON.stringify(t));}catch(e){toast('הלוגו גדול מדי לשמירה — ישמש רק לייצוא הנוכחי');}prefsPush({tb:t});}
function pdfDialog(){if(!state.objs.length){toast('הלוח ריק');return;}const t=Object.assign({paper:'A3',orient:'L',company:'',project:'',dwgno:'',rev:'0',drafter:'',checker:'',approver:'',notes:'',bomPage:'1',logo:''},tbLoad());
 const today=new Date().toISOString().slice(0,10);const F=(id,l,v,type='text')=>`<div class="fld"><label>${l}</label><input id="t_${id}" type="${type}" value="${esc(v)}"></div>`;
 const S=(id,l,opts,v)=>`<div class="fld"><label>${l}</label><select id="t_${id}">${opts.map(([a,b])=>`<option value="${a}" ${a===v?'selected':''}>${b}</option>`).join('')}</select></div>`;
 let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${S('paper','גודל דף',[['A4','A4'],['A3','A3'],['A2','A2']],t.paper)}${S('orient','כיוון',[['L','לרוחב'],['P','לאורך']],t.orient)}</div>`;
 h+=F('company','שם החברה / הארגון',t.company)+F('project','שם הפרויקט',t.project)+F('title','שם השרטוט',state.name);
 h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${F('dwgno','מס׳ שרטוט',t.dwgno)}${F('rev','גרסה (Rev)',t.rev)}${F('drafter','שם המשרטט',t.drafter)}${F('date','תאריך',today,'date')}${F('checker','בודק',t.checker)}${F('approver','מאשר',t.approver)}</div>`;
 h+=F('notes','הערות (יופיעו מעל טבלת השרטוט)',t.notes);
 h+=S('bomPage','רשימת ציוד',[['1','עמוד נוסף עם רשימת ציוד'],['0','ללא']],t.bomPage);
 h+=`<div class="fld"><label>לוגו (תמונה)</label><div style="display:flex;gap:10px;align-items:center"><div id="t_logoPrev" style="width:90px;height:50px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden">${(t.logo||defLogo())?`<img src="${t.logo||defLogo()}" style="max-width:100%;max-height:100%">`:'<span style="color:#888;font-size:12px">ללא לוגו</span>'}</div><label class="wbtn" style="cursor:pointer">בחר תמונה<input id="t_logoF" type="file" accept="image/*" style="display:none"></label><button class="wbtn" id="t_logoX">ברירת מחדל</button></div></div>`;
 h+=`<div class="hint">כל מה שכתוב כאן (חוץ מהתאריך ושם השרטוט) נשמר תוך כדי הקלדה ויופיע בכל השרטוטים הבאים, עד שתשנה אותו. השרטוט ממוקם בקנה מידה סטנדרטי (1:5, 1:10…) כך שאפשר למדוד בהדפסה.</div>`;

  shapes.forEach(sh=>{let len=0;try{len=sh.getTotalLength();}catch(e){return;}if(!(len>0))return;const k=Math.max(2,Math.min(400,Math.ceil(len/.8)));const pts=[];for(let i=0;i<=k;i++){const q=sh.getPointAtLength(len*i/k);pts.push(P(m,q.x,q.y));}
   const closed=/[zZ]\s*$/.test(sh.getAttribute?.('d')||'')||el.tagName!=='path';poly(L,col,simplify(pts),closed);if(sh!==el)sh.remove();});});

function exportImage0(){try{wireLayout();}catch(e){}const b=boundsAll(true),pad=12;const bbw=Math.max(60,Math.min(b.w*.3,240)),bbh=bbw*.42;const x=b.x-pad,y=b.y-pad,w=Math.max(b.w+2*pad,bbw+2*pad),h=b.h+2*pad+bbh+pad*.5;const k=Math.min(10,9000/Math.max(w,h),Math.sqrt(48e6/(w*h)));
 EXPMIN=1.6/k;const body=content({sel:false});EXPMIN=0;
 const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${Math.round(w*k)}" height="${Math.round(h*k)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${body}${creditBadge(x+w-bbw-pad*.5,y+h-bbh-pad*.5,bbw,bbh)}</svg>`;
 const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);let url;try{url=c.toDataURL('image/png');}catch(e){url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}
  modal('תמונת הלוח',`<img src="${url}" style="width:100%;border-radius:8px;background:#fff">`,[{t:'⬇ הורד PNG',cls:'pri',fn:()=>{saveFile(safeName(state.name)+'.png',dataUrlToBlob(url));return false;}},{t:'סגור'}]);};
 img.onerror=()=>toast('יצירת התמונה נכשלה');img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}
function help(){modal('איך עובדים',`<div style="line-height:1.7;font-size:15px">
<b>סרגל הכלים (בצד):</b> "הוסף" פותח את ספריית הרכיבים עם חיפוש. "חיווט" מפעיל מצב חיווט. "מאפיינים" פותח פאנל עריכה של הרכיב הנבחר — שינויים נשמרים מיד. מתחת: שכפול, סיבוב, נעילה, מחיקה, "הכל" (התאמת תצוגה) ו"גריד".<br>
<b>הוספה:</b> רכיב נכנס אוטומטית למקום הפנוי הבא על פס DIN (או אחרי הרכיב שבחרת).<br>
<b>הזזה:</b> גרור רכיב; ליד פס DIN הוא נצמד. גרירת פס מזיזה את הרכיבים שעליו. ארון/לוח — בחר אותו קודם ואז גרור.<br>
<b>תצוגה:</b> גרירה על רקע ריק מזיזה, צביטה מגדילה/מקטינה.<br>
<b>חיווט:</b> הקש על מהדק, נקודות פינה, ומהדק יעד.<br>
<b>צבע:</b> בחר צבע לפני הוספת מפסק, או בחר רכיב ואז הקש על צבע.<br>
<b>שמירה:</b> נשמר אוטומטית בדפדפן. "שמור בשם" ליצירת כמה לוחות. לגיבוי — "העתק קובץ פרויקט".</div>`);}
